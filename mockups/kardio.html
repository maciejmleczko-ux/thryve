:root{
  /* ---- Mekkio motion system ----------------------------------------
     The ONLY easing curves and durations in the app. Every animation /
     transition (CSS, inline styles, and WAAPI via MOTION in JS) uses
     these, so motion feels identical on every screen. Rules: CLAUDE.md. */
  --m-ease:cubic-bezier(.16,1,.3,1);           /* standard: entrances, press, anything that moves */
  --m-ease-sheet:cubic-bezier(.22,1,.36,1);    /* sheet / drawer entrance + snap-back */
  --m-ease-exit:cubic-bezier(.4,0,1,1);        /* sheet / drawer closed by a button; swipe fly-out */
  --m-ease-throw:cubic-bezier(.32,.72,0,1);    /* sheet closed by a finger throw */
  --m-ease-land:cubic-bezier(0,0,.3,1);        /* swipe fly-in: arrives at speed, lands softly */
  --m-ease-spring:cubic-bezier(.22,1.2,.36,1); /* tiny overshoot: snap-to-page, check tick, tags */
  --m-dur-press-in:.1s;    /* finger down */
  --m-dur-press-out:.16s;  /* finger up (slower, soft) */
  --m-dur-quick:.15s;      /* colour / background state, small toggles */
  --m-dur-fade:.24s;       /* backdrops, fades, toast, small moves */
  --m-dur-exit:.26s;       /* closing a sheet / drawer (always faster than its entrance) */
  --m-dur-snap:.3s;        /* snap-back, quick reveals */
  --m-dur-in:.4s;          /* element entrance, sheet/drawer entrance, page slide, nav blob */
  --m-dur-pop:.5s;         /* success pop, icon spin, finish-screen items */
  --m-dur-tile:.7s;        /* big tiles / hero */
  --m-dur-draw:.9s;        /* chart line draw */
  /* top inset + 5px extra so headers sit clear of the iOS 27 status-bar blur band (one knob) */
  --top-inset:calc(env(safe-area-inset-top, 0px) + 5px);
  --bg:#2c2727;
  --card:#5d5b5b;
  --card-2:#3e3939;
  --light:#f6f4f4;
  --light-2:#f5f5f5;
  --border:#d0d0d0;
  --orange:#f15a23;
  --orange-pill:#ffc4ae;
  --tip:#f7d7cc;
  --text:#f6f4f4;
  --text-dark:#2c2727;
  --muted:rgba(255,255,255,.6);
  --radius-lg:24px;
  --radius-md:16px;
  --radius-sm:12px;

  /* --------------------------------------------------------------
     Mekkio (v2) palette — the live app. Everything above is the old
     dark theme, now referenced only by the dead #view-* screens.
     One value per colour, one spelling; feed new v2 CSS from here.
     -------------------------------------------------------------- */
  --m-orange:#ff3300;      /* accent */
  --m-ink:#343941;         /* primary text on light surfaces */
  --m-muted:#96959b;       /* secondary / hint text */
  --m-bg:#eceaf1;          /* app background (lilac) */
  --m-panel:#f5f1fb;       /* screen panel */
  --m-card:#fdfbff;        /* raised card */
  --m-red-page:#dd2b17;    /* page bed behind GYM / finish panels */
  --m-plan-easy:#708fe1;   /* auto plan cards, by difficulty */
  --m-plan-mid:#3b63cb;
  --m-plan-hard:#2642a4;
  --m-plan-c-easy:#ff6343; /* custom / imported plan cards */
  --m-plan-c-mid:var(--m-orange);
  --m-plan-c-hard:#cd1200;
  --m-plan-accent:#6891ff; /* planned/missed/done markers on History calendar + Dashboard weekly progress */

  --m-r-sm:12px;           /* inputs, chips, small tiles */
  --m-r-md:16px;           /* cards, panels */
  --m-r-pill:999px;        /* buttons, pills, dots */

  --m-font:'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

  /* type scale (audit W3) — everything below --m-fs-2xs was <11px */
  --m-fs-2xs:11px;   /* micro-labels, dates, meta, legend, badges — hard floor */
  --m-fs-xs:12px;    /* chips, secondary buttons, hints, stat values */
  --m-fs-sm:13px;    /* popup body copy, small buttons */
  --m-fs-base:14px;  /* inputs, card names, section labels */
  --m-fs-md:16px;    /* prominent controls / card titles */
  --m-fs-lg:20px;    /* popup titles */
  --m-fs-xl:24px;    /* section headlines, mid numbers */
  --m-fs-2xl:30px;   /* screen titles, big stat numbers */
  --m-fs-hero:40px;  /* hero numbers, GRATULACJE */
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--m-font); /* Geist app-wide; Inter (embedded @font-face above) is the fallback */
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
/* GYM v2: .app's shared 110px bottom clearance (reserved for the
   floating nav on every route) is transparent and shows body's own
   background through it — invisible on the app's usual dark theme,
   but a visible dark stripe under GYM v2's red screen. Paint body red
   only while this route is active so that gap reads as a continuation
   of the screen instead of a cut-off strip. */
body.gymv2-bg{background:var(--m-panel);}
html.gymv2-bg,html.gymv2-bg body{overscroll-behavior-y:none;}
/* Dashboard preview: designed to read as a single fixed screen, not a
   scrolling page (standard iPhone viewport only — other sizes come
   later). Toggled on <html> because whichever of html/body is the
   browser's "scrolling element" varies — overflow:hidden has to hit
   both to be reliable.
   Base state is fully rigid (overflow:hidden, touch-action:none) — zero
   scroll capability, zero touch give, when content fits (the common
   case). renderDashboard() measures the real content height after
   rendering and adds .dashboard-scrollable only when it actually
   overflows the viewport (e.g. the "Trener AI" box expanded) — that
   variant switches to overflow-y:auto + touch-action:pan-y so a genuine
   drag can reach the rest of the content. overscroll-behavior-y:none
   (Maciej, 2026-09-16) hard-stops it at both ends instead of the default
   iOS rubber-band bounce — .dash-root's own padding-bottom (126px) is
   already tuned so the last real tile's bottom edge rests ~20px above
   the floating nav at max scroll; the old bounce let a drag travel past
   that and briefly show empty space before springing back. So: no
   scroll at all when nothing needs it, hard-bounded scroll only when
   something does.
   body.dashboard-bg is the other half of this — the light background
   needs to extend under any bounce/overscroll, or that gap shows the
   app's normal dark body color instead of feeling like a continuation
   of the screen (same technique as .gymv2-bg above). */
html.dashboard-lock, html.dashboard-lock body{overflow:hidden;height:100dvh;touch-action:none;}
html.dashboard-lock.dashboard-scrollable, html.dashboard-lock.dashboard-scrollable body{overflow-x:hidden;overflow-y:auto;touch-action:pan-y;overscroll-behavior-y:none;}
body.dashboard-bg{background:var(--m-bg);}
/* PLANS v2 — same "fixed screen, real scroll only when actually needed"
   recipe as Dashboard above. STANDING RULE: every new v3 screen gets
   this same 3-part treatment (see [[feedback_thryve_animation_vocabulary]]):
     1. html.<screen>-lock, html.<screen>-lock body{overflow:hidden;
        height:100dvh;touch-action:none;} — rigid by default.
     2. html.<screen>-lock.<screen>-scrollable (+ body) switches to
        overflow-y:auto;touch-action:pan-y; (default overscroll-behavior,
        not "none", so the native iOS rubber-band bounce/settle still
        plays) — added by that screen's render function only when its
        real content actually overflows (measure the last real element's
        bottom against #bottomNav's top, exactly like renderPlansListV2()
        does below — never body.scrollHeight vs clientHeight, which is
        always inflated ~110px by .app's shared bottom-nav padding
        regardless of route).
     3. body.<screen>-bg{background:<that screen's own light tone>} —
        toggled alongside <screen>-lock in goRoute() — so any bounce/
        overscroll reveals that screen's own color, not the app's dark
        default (#2c2727) bleeding through. */
html.plansv2-lock, html.plansv2-lock body{overflow:hidden;height:100dvh;touch-action:none;}
html.plansv2-lock.plansv2-scrollable, html.plansv2-lock.plansv2-scrollable body{overflow-x:hidden;overflow-y:auto;touch-action:pan-y;}
body.plansv2-bg{background:var(--m-panel);}
/* Stats v2 + History v2 share Plans v2's flat lilac page background —
   same technique, same color (Maciej: "tlo w statystykach niech bedzie
   - F5F1FB"), just missing until now — the base body{background:var(--bg)}
   dark color was bleeding through the bottom-nav-clearance gap and any
   overscroll bounce on both screens. */
body.statsv2-bg{background:var(--m-panel);}
body.histv2-bg{background:var(--m-panel);}
/* Same technique, reused for modals — background stays put while a popup is open. */
html.modal-lock, html.modal-lock body{overflow:hidden;height:100dvh;touch-action:none;overscroll-behavior:none;}
button{font-family:inherit;}
.app{max-width:440px;margin:0 auto;position:relative;min-height:100vh;padding-bottom:110px;}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + var(--top-inset)) 20px 0;}
.topbar.hidden{display:none;}
.brand-mark{display:flex;align-items:center;}
.logo-svg{height:53px;width:auto;display:block;color:#fff;}
.topbar.topbar-light{background:var(--light);margin:0;padding:calc(16px + var(--top-inset)) 20px 0;border-radius:0;}
.topbar.topbar-light .logo-svg{color:var(--orange);}
.plan-pill{background:var(--orange);color:#fff;border:none;border-radius:var(--m-r-pill);padding:11px 16px;max-width:210px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:var(--m-fs-base);letter-spacing:.32px;font-weight:700;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease);flex-shrink:0;}
.plan-pill:active{transform:scale(.94);}
.plan-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.plan-pill .ph{width:15px;height:15px;flex-shrink:0;}
.topbar-icon-btn{background:none;border:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--light);flex-shrink:0;transition:transform var(--m-dur-press-out) var(--m-ease);}
.topbar-icon-btn .ph{width:26px;height:26px;}
.topbar-icon-btn:active{transform:scale(.9);}
.topbar.topbar-light .topbar-icon-btn{color:var(--orange);}
.topbar.topbar-orange .topbar-icon-btn{color:#fff;}

.section-label{display:flex;align-items:center;gap:11px;padding:0 20px;margin-top:32px;}
.section-label ph-icon{width:32px;height:32px;}
.section-label .ph{width:32px;height:32px;color:var(--light);}
.section-label span{font-size:var(--m-fs-md);letter-spacing:.48px;}
.header-row{display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-top:32px;}
.header-row .section-label{margin:0;padding:0;}

.date-pill{background:var(--card);border:none;border-radius:var(--m-r-sm);padding:10px 16px;display:flex;align-items:center;gap:10px;color:var(--light);font-weight:700;font-size:var(--m-fs-base);cursor:pointer;}
.date-pill .ph{width:18px;height:18px;}
.date-nav{display:flex;align-items:center;gap:10px;color:var(--light);font-weight:400;font-size:var(--m-fs-base);}
.date-nav-btn{width:18px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.date-nav-btn .ph{width:18px;height:18px;}
.icon-btn-row{display:flex;gap:8px;align-items:center;}
.icon-btn-row .ph{width:24px;height:24px;color:var(--light);cursor:pointer;}

/* ---------- generic card ---------- */
.panel{background:var(--light);border-radius:0 0 20px 20px;margin:0 0 20px;padding:16px 20px;color:var(--text-dark);}
.panel-inner{background:none;border-radius:0;margin:0;padding:0;}
.header-row.on-panel{background:var(--light);color:var(--text-dark);margin:0;padding:32px 20px 4px;border-radius:0;}
.gym-top-block{background:var(--light);}
.header-row.on-panel .section-label .ph{color:var(--orange);}
.header-row.on-panel .section-label span{color:var(--text-dark);}

/* ---------- ambient background glow (behind every OLD/dark screen) ----------
   Tuned for the dark app background it was designed against — on any v3
   screen's light lilac/pale background it just reads as an unwanted warm
   haze (most visible wherever that screen's own content is sparse, e.g.
   plan editor v2's roomier field spacing — Maciej, 2026-08-31). Hidden
   whenever a v3 screen is active, matching how .topbar is already hidden
   for the same routes (see goRoute()'s isV3). */
.app-glow{position:fixed;top:-260px;left:-100px;width:640px;height:640px;border-radius:50%;
  background:radial-gradient(circle, rgba(241,90,35,.55), rgba(44,39,39,0) 65%);pointer-events:none;z-index:-1;will-change:transform;}
/* Load screen (Figma node 107:329) — sits above everything (.topbar,
   .app-glow, the whole .app tree) while shown; showLoadScreenV2()
   toggles display + the fade-out via .hiding.
   Maciej (real-device screenshot): "zdjecie nie wypelnia calego ekranu
   telefonu" — the first implementation copied Figma's literal export
   values (a 465x827px effects image, offset top-left) 1:1. That fits
   the exact 375x812 frame the design was authored at, but on a taller
   real device (iPhones commonly run 852-932px tall) a fixed-pixel box
   like that runs out before reaching the bottom, leaving the plain
   background color exposed below it — exactly the "doesn't fill the
   screen" symptom. Also re-pulled fresh design context while fixing
   this and found the actual current composition simpler than first
   extracted: flat var(--m-orange) base (no separate photo behind it) with the
   gym-equipment texture blended via mix-blend-mode:luminosity, not
   multiply. Fixed both: solid color background instead of a second
   image, and the texture layer now uses the same full-cover,
   percentage-based sizing as everything else in this app's charts
   (position:absolute;inset:0;object-fit:cover) instead of a fixed
   pixel box, so it always fills the whole screen regardless of the
   real device's height. */
.loadv2-root{display:none;position:fixed;inset:0;z-index:9999;overflow:hidden;
  background:var(--m-orange);flex-direction:column;align-items:center;opacity:1;transition:opacity var(--m-dur-in) ease;}
.loadv2-root.visible{display:flex;}
.loadv2-root.hiding{opacity:0;}
.loadv2-effects{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
/* Figma node 379:8548 tints the whole background photo with a flat
   93%-opacity brand orange rather than the old grayscale-luminosity
   treatment — most of the photo's own color is gone, only its
   light/dark shape still reads through as texture. */
.loadv2-tint{position:absolute;inset:0;background:rgba(255,51,0,.93);}
.loadv2-mid{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 24px;}
.loadv2-logo svg{display:block;width:168px;height:auto;}
.loadv2-footer{position:relative;z-index:1;padding:0 20px calc(20px + env(safe-area-inset-bottom,0px));text-align:center;}
.loadv2-version{margin:0;color:#fff;font-size:var(--m-fs-2xs);font-weight:500;letter-spacing:1.1px;}
.loadv2-copyright{margin:4px 0 0;color:#fff;font-size:var(--m-fs-2xs);font-weight:300;}
/* Entrance: logo slides up + fades in when the splash appears, footer
   follows on the same staggered rise (reuses the app-wide var(--m-ease)
   / translateY vocabulary — see [[feedback_thryve_animation_vocabulary]]).
   Scoped to .visible so it replays on every launch (the display:none ->
   flex toggle restarts it); all done well inside the 1.5s the splash is
   shown. */
@media (prefers-reduced-motion: no-preference){
  @keyframes loadv2Rise{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .loadv2-root.visible .loadv2-logo{animation:loadv2Rise var(--m-dur-tile) var(--m-ease) backwards;animation-delay:.09s;}
  .loadv2-root.visible .loadv2-footer{animation:loadv2Rise var(--m-dur-pop) var(--m-ease) backwards;animation-delay:.42s;}
}
@media (prefers-reduced-motion: reduce){ .loadv2-root{transition:none;} }

/* GYM finish screen (Figma node 185:14366, "03. GYM - FINISH") — full-screen
   celebratory confirmation shown by showGymFinishV2() right after a workout
   is saved from GYM v2. Lottie "success" animation + a session summary;
   dismissed by the CTA (no auto-advance), then it hands off to the Dashboard.
   Same show/hide mechanics as the load screen above (.visible toggles
   display, .hiding fades out). Mirrors GYM v2's red-under-lilac panel
   treatment: var(--m-red-page) page with a var(--m-panel) panel whose 26px
   bottom corners let a sliver of red through. */
.gymfin-root{display:none;position:fixed;inset:0;z-index:9500;overflow:hidden;background:var(--m-red-page);opacity:1;transition:opacity var(--m-dur-in) ease;}
.gymfin-root.visible{display:block;}
.gymfin-root.hiding{opacity:0;}
/* panel is now a flex column: topbar / body (centred) / CTA — the old
   absolute .gymfin-center + full-screen .gymfin-fx confetti image are gone,
   replaced by the Lottie "success" animation + a session summary. */
.gymfin-panel{position:absolute;inset:0;background:var(--m-panel);border-radius:0 0 26px 26px;overflow:hidden;display:flex;flex-direction:column;padding:calc(20px + var(--top-inset)) 20px 24px;}
.gymfin-topbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.gymfin-brand{display:flex;align-items:center;gap:14px;}
.gymfin-brand .ph{width:34px;height:34px;color:var(--m-orange);display:block;}
.gymfin-brand-word{font-size:var(--m-fs-2xl);font-weight:400;color:var(--m-ink);letter-spacing:-.02em;}
.gymfin-chat{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.gymfin-chat .ph{width:22px;height:22px;color:var(--m-orange);display:block;}
.gymfin-brand .ph svg, .gymfin-chat .ph svg{display:block;width:100%;height:100%;}

/* The #7 progress card + history link can push content past a short
   phone's height. .gymfin-inner's `margin:auto 0` centres the block when
   it fits (old behaviour) and collapses to top-aligned + scrollable when
   it doesn't, instead of clipping at the vertical centre. */
.gymfin-body{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;}
.gymfin-inner{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center;width:100%;padding:2px 0;}
/* smaller than before — the #7 "Twój postęp" card now carries the payoff,
   so the success flourish steps back to leave room without scrolling. */
.gymfin-anim{width:min(140px,22vh);height:min(140px,22vh);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.gymfin-anim svg{display:block;width:100%;height:100%;}
.gymfin-anim .gymfin-check{display:none;}
/* fallback (no Lottie): collapse the box to the check so it doesn't
   float in a tall empty square now that the body is top-aligned. */
.gymfin-anim.is-fallback{width:88px;height:88px;}
.gymfin-anim.is-fallback .gymfin-check{display:flex;}
.gymfin-check{width:88px;height:88px;border-radius:50%;background:var(--m-orange);align-items:center;justify-content:center;flex-shrink:0;}
.gymfin-check svg{width:52px;height:52px;display:block;}
.gymfin-heads{display:flex;flex-direction:column;gap:8px;}
.gymfin-title{margin:0;font-size:var(--m-fs-hero);font-weight:500;color:var(--m-orange);letter-spacing:1.6px;line-height:1;}
.gymfin-sub{margin:0;font-size:var(--m-fs-md);font-weight:400;color:#000;letter-spacing:.7px;}

/* #7 — "Twój postęp" card: biggest positive change vs the previous
   workout of the same plan day (reps at equal/higher weight, else weight).
   Hidden when there's no prior data to compare against. */
.gymfin-progress{width:100%;background:var(--m-plan-mid);border-radius:var(--m-r-md);padding:14px 16px 15px;color:#fff;text-align:left;}
.gymfin-progress[hidden]{display:none;}
.gymfin-progress-k{margin:0;display:flex;align-items:center;gap:8px;font-size:var(--m-fs-2xs);font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.82);}
.gymfin-progress-k .ph{width:14px;height:14px;flex-shrink:0;}
.gymfin-progress-k .ph svg{display:block;width:100%;height:100%;}
.gymfin-progress-v{margin:9px 0 0;font-size:var(--m-fs-2xl);font-weight:600;letter-spacing:-.02em;line-height:1;}
.gymfin-progress-ex{margin:7px 0 0;font-size:var(--m-fs-base);font-weight:500;}
.gymfin-progress-delta{margin:3px 0 0;font-size:var(--m-fs-xs);color:rgba(255,255,255,.78);}
.gymfin-cap{margin:0;font-size:var(--m-fs-2xs);color:var(--m-muted);text-align:center;}
.gymfin-cap[hidden]{display:none;}

/* summary tiles — the four dashboard bento colours */
.gymfin-stats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px;}
.gymfin-stat{border-radius:var(--m-r-sm);padding:14px 13px 13px;text-align:left;}
.gymfin-stat-k{margin:0 0 5px;font-size:var(--m-fs-2xs);font-weight:500;letter-spacing:.09em;text-transform:uppercase;}
.gymfin-stat-v{margin:0;font-size:31px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;}
.gymfin-stat-v small{font-size:14px;font-weight:400;margin-left:3px;letter-spacing:0;}
.gymfin-stat--orange{background:var(--m-orange);}
.gymfin-stat--blue{background:var(--m-plan-mid);}
.gymfin-stat--navy{background:var(--m-plan-hard);}
.gymfin-stat--orange,.gymfin-stat--blue,.gymfin-stat--navy{color:#fff;}
.gymfin-stat--orange .gymfin-stat-k,.gymfin-stat--blue .gymfin-stat-k,.gymfin-stat--navy .gymfin-stat-k{color:rgba(255,255,255,.78);}
.gymfin-stat--orange .gymfin-stat-v small,.gymfin-stat--blue .gymfin-stat-v small,.gymfin-stat--navy .gymfin-stat-v small{color:rgba(255,255,255,.72);}
.gymfin-stat--plain{background:var(--m-card);}
.gymfin-stat--plain .gymfin-stat-k{color:var(--m-muted);}
.gymfin-stat--plain .gymfin-stat-v{color:var(--m-ink);}
.gymfin-stat--plain .gymfin-stat-v small{color:var(--m-muted);}

.gymfin-record{width:100%;display:flex;align-items:center;gap:12px;background:var(--m-card);border-radius:var(--m-r-sm);padding:12px 14px;text-align:left;}
.gymfin-record[hidden]{display:none;}
.gymfin-record .ph{width:26px;height:26px;color:var(--m-orange);flex-shrink:0;}
.gymfin-record .ph svg{display:block;width:100%;height:100%;}
.gymfin-record-k{margin:0;font-size:var(--m-fs-2xs);font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--m-muted);}
.gymfin-record-v{margin:1px 0 0;font-size:var(--m-fs-base);font-weight:500;color:var(--m-ink);}

.gymfin-cta{width:100%;flex-shrink:0;border:none;border-radius:var(--m-r-pill);background:var(--m-orange);color:#fff;padding:16px;font-family:inherit;font-size:var(--m-fs-base);font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:4px;transition:transform var(--m-dur-press-out) var(--m-ease);}
.gymfin-cta:active{transform:scale(.97);}
.gymfin-link{width:100%;flex-shrink:0;border:0;background:none;color:var(--m-orange);font-family:inherit;font-size:var(--m-fs-xs);font-weight:600;padding:9px 0 2px;cursor:pointer;}
.gymfin-link[hidden]{display:none;}

@media (max-height:700px){
  .gymfin-anim{width:110px;height:110px;}
  .gymfin-anim.is-fallback{width:72px;height:72px;}
  .gymfin-body{gap:10px;}
  .gymfin-title{font-size:var(--m-fs-2xl);}
  .gymfin-progress{padding:12px 15px 13px;}
}

@media (prefers-reduced-motion: no-preference){
  @keyframes gymfinPop{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}
  /* Lottie (loaded on demand, sped up ×1.6) plays the check + confetti once
     and holds the last frame. The summary then rises in staggered — same
     loadv2Rise keyframe + curve as the load screen / dashboard tiles. */
  .gymfin-root.visible .gymfin-anim.is-fallback .gymfin-check{animation:gymfinPop var(--m-dur-pop) var(--m-ease) backwards;animation-delay:.06s;}
  .gymfin-root.anim-in .gymfin-heads{animation:loadv2Rise var(--m-dur-pop) var(--m-ease) backwards;animation-delay:.14s;}
  .gymfin-root.anim-in .gymfin-progress:not([hidden]){animation:loadv2Rise var(--m-dur-pop) var(--m-ease) backwards;animation-delay:.22s;}
  .gymfin-root.anim-in .gymfin-stats .gymfin-stat{animation:loadv2Rise var(--m-dur-pop) var(--m-ease) backwards;}
  .gymfin-root.anim-in .gymfin-stats .gymfin-stat:nth-child(1){animation-delay:.32s;}
  .gymfin-root.anim-in .gymfin-stats .gymfin-stat:nth-child(2){animation-delay:.4s;}
  .gymfin-root.anim-in .gymfin-stats .gymfin-stat:nth-child(3){animation-delay:.48s;}
  .gymfin-root.anim-in .gymfin-stats .gymfin-stat:nth-child(4){animation-delay:.56s;}
  .gymfin-root.anim-in .gymfin-record:not([hidden]){animation:loadv2Rise var(--m-dur-pop) var(--m-ease) backwards;animation-delay:.64s;}
  .gymfin-root.anim-in .gymfin-cap:not([hidden]){animation:loadv2Rise var(--m-dur-in) var(--m-ease) backwards;animation-delay:.72s;}
  .gymfin-root.anim-in .gymfin-cta{animation:loadv2Rise var(--m-dur-in) var(--m-ease) backwards;animation-delay:.76s;}
  .gymfin-root.anim-in .gymfin-link:not([hidden]){animation:loadv2Rise var(--m-dur-in) var(--m-ease) backwards;animation-delay:.82s;}
}
@media (prefers-reduced-motion: reduce){ .gymfin-root{transition:none;} }
html.dashboard-lock .app-glow, html.plansv2-lock .app-glow, html.gymv2-bg .app-glow, html.statsv2-bg .app-glow, html.histv2-bg .app-glow{display:none;}
@media (prefers-reduced-motion: no-preference){
  .app-glow{animation:glowDrift 24s ease-in-out infinite;}
  @keyframes glowDrift{
    0%{transform:translate(0,0);}
    25%{transform:translate(70px,60px);}
    50%{transform:translate(10px,140px);}
    75%{transform:translate(-60px,50px);}
    100%{transform:translate(0,0);}
  }
}

/* ---------- bottom nav ---------- */
.bottom-nav{position:fixed;left:0;right:0;bottom:20px;
  width:calc(100% - 40px);max-width:400px;margin:0 auto;
  background:rgba(44,39,39,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-radius:var(--m-r-pill);box-shadow:0 10px 30px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 19px;z-index:20;}
.nav-item{background:none;border:none;display:flex;align-items:center;justify-content:center;width:55px;height:55px;border-radius:50%;cursor:pointer;flex-shrink:0;}
.nav-item .ph{width:27px;height:27px;color:var(--light);}
/* Without this, an icon's own <svg> (no width/height attrs, sized only
   by its viewBox's aspect ratio) renders at .ph's width but a HEIGHT
   derived from its own intrinsic ratio, not clamped to .ph's box — a
   square viewBox (256x256, every other nav icon) coincidentally comes
   out right by accident, but the old clipboard-text's non-square 21.5x26.5
   viewBox rendered 27px wide by 33px tall, visibly overflowing its
   circle ("ikona planu sie rozjechala jakby byla wieksza"). #bottomNav
   sits outside every existing "root" scope that already has this fix
   (.dash-root/.plansv2-root/.gymv2-root .ph svg) — same recurring bug,
   just a spot those scoped rules never reached. */
#bottomNav .ph svg{display:block;width:100%;height:100%;}
.nav-item.active{background:var(--orange);}
.nav-item.active .ph{color:#fff;}
/* v3-only nav (Figma node 107:457, "menu" arm of the new Dashboard).
   Rebuilt 2026-09-04 straight from Maciej's exact exported SVG rather
   than the earlier approximation — pill fill/border, per-item grey
   pill + dark icon color for every inactive item (not just Plans, as
   first guessed), and exact 52px/69px sizing all pulled from the SVG's
   literal coordinates instead of eyeballing proportions. #bottomNav's
   buttons are (re)built from NAV_ITEMS_V3 by renderBottomNavForContext().
   Gradient border: SVG's stroke is a horizontal white→white74%→white
   linear-gradient on the pill's rounded outline — border-image doesn't
   respect border-radius, so it's a ::before overlay instead, masked to
   just the 1px ring (content-box vs border-box, XOR'd). ::before is
   position:absolute so it doesn't become a phantom first flex item and
   break the row's justify-content:space-between. */
/* Maciej, 2026-09-04: "tlo powinno miec jednak wieksza transparencje -
   90%" — first read as 90% see-through (opacity .1), but his follow-up
   SVG makes the actual meaning explicit: fill-opacity="0.9" — i.e.
   90% opaque, up from the earlier .51. */
.bottom-nav.bottom-nav-light{background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(1.44px);backdrop-filter:blur(1.44px);box-shadow:0 8px 24px rgba(0,0,0,.08);padding:12px 24px;min-height:62px;box-sizing:border-box;}
.bottom-nav.bottom-nav-light::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.74) 50.48%,#fff 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.bottom-nav.bottom-nav-light .nav-item{width:37.52px;height:37.52px;background:transparent;position:relative;z-index:1;}
.bottom-nav.bottom-nav-light .nav-item .ph{width:23.09px;height:23.09px;} /* Figma: 32px icon frame in a 52px component scaled to 37.52 */
.bottom-nav.bottom-nav-light .nav-item .ph{color:rgba(52,57,65,.77);transition:color var(--m-dur-snap) var(--m-ease);}
/* one orange indicator that glides between tabs and grows/shrinks to the
   target's size (GYM is bigger) — positioned by positionNavBlob(). The
   per-item .active background is now transparent; the blob is the orange. */
.bottom-nav.bottom-nav-light .nav-item.active{background:transparent;}
.bottom-nav.bottom-nav-light .nav-item.active .ph{color:#fff;}
.bottom-nav .nav-blob{display:none;}
.bottom-nav.bottom-nav-light .nav-blob{display:block;position:absolute;top:50%;left:0;width:49.78px;height:49.78px;margin-top:-24.89px;border-radius:50%;background:var(--m-orange);transform-origin:50% 50%;will-change:transform;pointer-events:none;z-index:0;transition:transform var(--m-dur-in) var(--m-ease);}
@media (prefers-reduced-motion: no-preference){
  /* the freshly-selected tab's icon spins into place as the blob arrives */
  .bottom-nav.bottom-nav-light .nav-item.nav-spin .ph{animation:navIconSpin var(--m-dur-pop) var(--m-ease);}
  @keyframes navIconSpin{0%{transform:rotate(-165deg) scale(.55);}100%{transform:rotate(0) scale(1);}}
}
@media (prefers-reduced-motion: reduce){ .bottom-nav.bottom-nav-light .nav-blob{transition:none;} .bottom-nav.bottom-nav-light .nav-item .ph{transition:none;} }
/* GYM's enlarged circle: 69px vs the v3 row's 52px (exact SVG ratio).
   Negative vertical margin equal to half the size delta keeps its
   flex-line footprint identical to its 52px siblings, so it visually
   pops above/below the pill without inflating the whole bar's height —
   a permanent size treatment, not tied to .active. */
.bottom-nav.bottom-nav-light .nav-item-lg{width:49.78px;height:49.78px;margin-top:-6.13px;margin-bottom:-6.13px;}
.bottom-nav.bottom-nav-light .nav-item-lg .ph{width:37px;height:37px;}
/* the barbell glyph is a filled outline with hairline strokes (~1px); the other nav icons are ~1.5px, so it read as thin — add a stroke in viewBox units */
.bottom-nav.bottom-nav-light .nav-item-lg .ph svg path{stroke:currentColor;stroke-width:.9;stroke-linejoin:round;}
.bottom-nav.bottom-nav-light{width:min(336px, calc(100% - 40px));}

  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;}
.ex-tile:active{transform:scale(.93);}
.ex-tile img{width:100%;height:100%;display:block;object-fit:cover;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none;}
.ex-tile.custom-tile{background:#fff;color:var(--text-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.ex-tile-placeholder{opacity:.35;}
.ex-tile-ghost{transition:box-shadow var(--m-dur-quick) ease;}
.ex-tile.custom-tile .ph{width:24px;height:24px;color:var(--orange);}
.ex-tile.custom-tile .t{font-size:var(--m-fs-2xs);font-weight:700;letter-spacing:.2px;text-transform:uppercase;text-align:center;padding:0 3px;line-height:1.15;}
/* Done exercise: fade only the content, not the tile — fading the whole
   white tile blended it into the lilac panel and made it read smaller.
   The full-colour check carries the "done" signal instead. */
.ex-tile.custom-tile.added :is(.gymv2-tile-icon,.gymv2-tile-label,.ph,.t){filter:grayscale(1);opacity:.28;}
.gymv2-tile-done{position:absolute;top:6px;right:6px;width:22px;height:22px;z-index:1;pointer-events:none;}
.gymv2-tile-done svg{display:block;width:22px;height:22px;}
/* Per-section "add your own exercise" tile in the old grouped exercise
   grid (renderGroupedExerciseGrid) — Maciej's own design, dashed
   border + plus baked into the SVG, appended once at the end of every
   muscle-group section (KLATKA, PLECY, ...) so a user missing an
   exercise from the library can add it without leaving that section.
   Compound selector (not just .ex-tile-add) so it reliably beats
   .ex-tile's own border/background regardless of rule order. */
.ex-tile.ex-tile-add{background:transparent;border:none;}
.ex-tile.ex-tile-add svg{width:100%;height:100%;display:block;}
/* Plan editor v2's grid mixes this .ex-tile add tile with .gymv2-tile
   exercise tiles — match their taller aspect-ratio (see .gymv2-tile) so
   the dashed "Dodaj ćwiczenie" box lines up with its neighbours. Value
   tracks buildExerciseTileV2's .png-icon aspect-ratio (115.667/136),
   not the plain .gymv2-tile one (115.667/122) — every exercise tile in
   this grid has an icon PNG now, so .png-icon is what it actually
   lines up against. */
#view-plan-editor-v2 .ex-tile.ex-tile-add{aspect-ratio:115.667/136;}

/* Three distinct blocks (Maciej, 2026-09-16): 1) quick recap, 2) prose on
   what faded/progressed, 3) a scannable per-exercise action list — not one
   wall of text. summary/analysis text still comes from the model as plain
   sentences; only actions[] is structured JSON, rendered as real rows. */
.ai-popup-summary{margin:0 0 12px;font-size:var(--m-fs-sm);font-weight:500;line-height:1.5;color:#fff;}
.ai-popup-text{margin:0 0 18px;font-size:var(--m-fs-sm);font-weight:300;line-height:1.55;color:rgba(255,255,255,.92);white-space:pre-line;}
.ai-popup-actions{display:flex;flex-direction:column;}
.ai-popup-actions-label{margin:0 0 18px;font-size:var(--m-fs-2xs);font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.82);}
/* Figma 320:16638 "open": name stacked over its description, thin 1px
   hairline between entries (not per-row cards) — divider sits BETWEEN
   entries via a top border on every entry but the first. */
.ai-popup-action{display:flex;flex-direction:column;gap:2px;padding:10px 0;}
/* :first-of-type, not :first-child — the label <p> above these <div>s
   occupies the actual first-child slot, so :first-child never matched
   the first exercise row and it wrongly got a divider too. */
.ai-popup-action:first-of-type{padding-top:0;}
.ai-popup-action:not(:first-of-type){border-top:1px solid rgba(255,255,255,.15);}
.ai-popup-action-ex{font-size:var(--m-fs-2xs);font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#fff;}
.ai-popup-action-do{font-size:var(--m-fs-sm);font-weight:300;line-height:1.4;color:rgba(255,255,255,.92);}
.ai-popup-note{margin:18px 0 0;font-size:var(--m-fs-2xs);line-height:1.45;color:rgba(255,255,255,.55);}
.feedback-type-row{display:flex;gap:8px;margin-bottom:14px;}
.feedback-type{flex:1;background:var(--light-2);border:1px solid var(--border);border-radius:10px;padding:9px 4px;font-size:var(--m-fs-xs);font-weight:700;color:var(--text-dark);cursor:pointer;font-family:inherit;}
.feedback-type.active{background:var(--orange);border-color:var(--orange);color:#fff;}

/* ---------- account panel (guest, no backend) ---------- */
.acct-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:95;display:flex;justify-content:flex-end;}
.acct-overlay.hidden{display:none;}
.acct-panel{background:var(--m-panel);width:min(420px,100%);height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(14px + var(--top-inset)) 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;}
/* every block keeps its natural height — otherwise flexbox shrinks the tall
   cards to fit the viewport (rows clip under .acct-rows overflow:hidden) and
   the panel never scrolls. flex-shrink:0 makes overflow-y:auto do its job. */
.acct-panel > *{flex-shrink:0;}
/* right drawer — same backdrop fade + slide-in curve as the bottom sheets,
   just on the X axis (mSheetBackdropIn/Out reused) */
@media (prefers-reduced-motion: no-preference){
  .acct-overlay{animation:mSheetBackdropIn var(--m-dur-fade) ease-out;}
  .acct-overlay.acct-closing{animation:mSheetBackdropOut var(--m-dur-fade) ease-in forwards;}
  .acct-overlay .acct-panel{animation:acctDrawerIn var(--m-dur-in) var(--m-ease-sheet);}
  .acct-overlay.acct-closing .acct-panel{animation:acctDrawerOut var(--m-dur-exit) var(--m-ease-exit) forwards;}
  @keyframes acctDrawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes acctDrawerOut{from{transform:translateX(0);}to{transform:translateX(100%);}}
}
/* header matches the tab-screen pattern: back-arrow + icon + title, no X */
.acct-head{display:flex;align-items:center;gap:10px;padding:6px 0 14px;}
.acct-back{margin-left:-6px;}
.acct-head-icon{width:32px;height:32px;flex-shrink:0;}
.acct-head-icon .ph, .acct-head-icon.ph{display:block;width:32px;height:32px;}
.acct-head-icon svg{display:block;width:100%;height:100%;}
.acct-title{margin:0;font-size:var(--m-fs-xl);font-weight:400;color:var(--m-ink);letter-spacing:-.02em;}
.acct-id{display:flex;align-items:center;gap:13px;padding:4px 2px 16px;background:none;border:0;text-align:left;cursor:pointer;font-family:inherit;width:100%;}
.acct-av{width:52px;height:52px;flex-shrink:0;border-radius:50%;overflow:hidden;}
.acct-av .ph{width:52px;height:52px;display:block;}
.acct-photo{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
/* profile sheet — photo picker */
.acct-photo-row{display:flex;align-items:center;gap:14px;}
.acct-photo-preview{width:56px;height:56px;flex-shrink:0;border-radius:50%;overflow:hidden;background:var(--m-panel);display:flex;align-items:center;justify-content:center;}
.acct-photo-preview .ph{width:56px;height:56px;display:block;}
.acct-photo-btns{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.acct-photo-pick{display:inline-block;background:var(--m-orange);color:#fff;border-radius:var(--m-r-pill);padding:8px 16px;font-size:var(--m-fs-xs);font-weight:600;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease);}
.acct-photo-pick:active{transform:scale(.96);}
.acct-photo-clear{background:none;border:0;color:var(--m-muted);font-size:var(--m-fs-2xs);font-weight:600;cursor:pointer;padding:2px 0;font-family:inherit;}
.acct-photo-clear[hidden]{display:none;}
.acct-id-txt{display:flex;flex-direction:column;gap:2px;min-width:0;}
.acct-id-name{font-size:var(--m-fs-base);font-weight:600;color:var(--m-ink);}
.acct-id-sub{font-size:var(--m-fs-2xs);color:var(--m-muted);}
.acct-cloud{position:relative;background:var(--m-card);border:1px solid #e6e2ec;border-radius:var(--m-r-md);padding:15px 15px 14px;}
.acct-soon{position:absolute;top:13px;right:13px;font-size:var(--m-fs-2xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--m-orange);background:#ffe9e3;border-radius:var(--m-r-pill);padding:4px 9px;}
.acct-cloud-t{margin:0 0 4px;font-size:var(--m-fs-sm);font-weight:600;color:var(--m-ink);}
.acct-cloud-d{margin:0;font-size:var(--m-fs-2xs);color:var(--m-muted);line-height:1.5;max-width:34ch;}
.acct-sec{margin:20px 0 8px;font-size:var(--m-fs-2xs);letter-spacing:.11em;text-transform:uppercase;color:var(--m-muted);}
.acct-rows{display:flex;flex-direction:column;background:var(--m-card);border:1px solid #e6e2ec;border-radius:var(--m-r-md);overflow:hidden;}
.acct-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;font-size:var(--m-fs-base);color:var(--m-ink);background:none;border:0;border-top:1px solid #e6e2ec;font-family:inherit;text-align:left;cursor:pointer;width:100%;text-decoration:none;box-sizing:border-box;}
.acct-row:first-child{border-top:0;}
.acct-row[hidden]{display:none;}
.acct-row:active{background:var(--m-panel);}
.acct-row .acct-v{color:var(--m-muted);font-size:var(--m-fs-xs);flex-shrink:0;}
.acct-row .acct-lead{display:flex;align-items:center;gap:11px;}
.acct-row .acct-lead .ph{width:17px;height:17px;color:var(--m-ink);}
/* Trener AI section in the account panel — same black/gradient-border
   identity as .dash-ai-card / .ai-popup-box (Maciej, 2026-09-16). */
.acct-rows--ai{
  border:1px solid transparent;
  background:linear-gradient(#000,#000) padding-box, linear-gradient(142deg,#FA1228 0%,#5A00D1 83%) border-box;
  box-shadow:inset 0 0 33px rgba(161,0,255,.94),inset 0 0 11.4px rgba(222,116,255,.5);
}
.acct-rows--ai .acct-row{color:#fff;border-top-color:rgba(255,255,255,.15);}
.acct-rows--ai .acct-row .acct-v{color:rgba(255,255,255,.6);}
.acct-rows--ai .acct-row:active{background:rgba(255,255,255,.08);}
.acct-hint{margin:7px 3px 0;font-size:var(--m-fs-2xs);color:var(--m-muted);}
.acct-row.danger,.acct-row.danger .acct-lead .ph{color:#c00;}
.acct-foot{margin:auto 0 0;padding-top:18px;font-size:var(--m-fs-2xs);color:var(--m-muted);text-align:center;line-height:1.5;}
/* above the account panel (95) AND the GYM finish screen (9500) — weight /
   edit-kcal sheets can be opened straight from the finish screen. */
/* Account sub-sheets (weight / body data / edit kcal / rename) ride the
   shared .plansv2-customize-* bottom sheet. z-index sits above the account
   panel (95) and the GYM finish screen (9500) — weight / kcal sheets open
   straight from the finish screen too. Only the few genuinely new bits
   below; everything else reuses .plansv2-customize-* / .exv2-field /
   .plansv2-choice-*. */
#nameEditOverlay,#weightSheet,#bodyDataSheet,#editKcalSheet,#changelogHistorySheet,#authSheet,#newPasswordSheet,#reminderSheet,#healthSheet,#soundTestSheet{z-index:9600;}
/* mConfirm() is opened from inside the account panel (z 95) and its sheets
   (9600) — e.g. "Usuń konto" — so it must sit above them, below the toast. */
#mConfirmOverlay{z-index:9650;}
.acct-num-row{display:flex;gap:12px;}
.acct-num-row.solo{max-width:172px;}
.acct-num-row.name{max-width:260px;}
/* account sub-sheets ride higher and breathe more than the base sheet:
   content hugs the top edge, actions pin to the bottom. */
#nameEditOverlay .plansv2-customize-stack,
#weightSheet .plansv2-customize-stack,
#bodyDataSheet .plansv2-customize-stack,
#editKcalSheet .plansv2-customize-stack,
#authSheet .plansv2-customize-stack{min-height:52%;}
#nameEditOverlay .plansv2-customize-card,
#weightSheet .plansv2-customize-card,
#bodyDataSheet .plansv2-customize-card,
#editKcalSheet .plansv2-customize-card,
#authSheet .plansv2-customize-card{gap:26px;padding:16px 20px 6px;}
#nameEditOverlay .plansv2-customize-section,
#weightSheet .plansv2-customize-section,
#bodyDataSheet .plansv2-customize-section,
#editKcalSheet .plansv2-customize-section,
#authSheet .plansv2-customize-section{gap:12px;}
#nameEditOverlay .plansv2-customize-actions,
#weightSheet .plansv2-customize-actions,
#bodyDataSheet .plansv2-customize-actions,
#editKcalSheet .plansv2-customize-actions,
#authSheet .plansv2-customize-actions{margin-top:auto;}
/* ---- cloud account (Supabase) — Faza 2 / E0 ---- */
.acct-cloud-signed{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;}
.acct-cloud-signed[hidden],.acct-cloud-cta[hidden]{display:none;}
.acct-cloud-email{font-size:var(--m-fs-xs);font-weight:600;color:var(--m-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acct-cloud-cta{display:inline-block;margin-top:10px;background:var(--m-orange);color:#fff;border:none;border-radius:var(--m-r-pill);padding:8px 16px;font-size:var(--m-fs-xs);font-weight:600;font-family:inherit;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease);}
.acct-cloud-cta:active{transform:scale(.96);}
.acct-cloud-mode-link{display:block;width:100%;background:none;border:0;color:var(--m-orange);font-size:var(--m-fs-xs);font-weight:600;cursor:pointer;padding:4px 0;font-family:inherit;text-align:center;}
.acct-cloud-forgot{background:none;border:0;color:var(--m-muted);font-size:var(--m-fs-2xs);cursor:pointer;padding:6px 0 0;font-family:inherit;align-self:flex-end;}
.acct-auth-error{margin:6px 0 0;font-size:var(--m-fs-2xs);color:#c00;line-height:1.4;}
.acct-oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;border:1px solid #dadce0;border-radius:var(--m-r-pill);padding:12px;font-size:var(--m-fs-base);font-weight:500;color:#3c4043;font-family:inherit;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease),background var(--m-dur-quick) ease;}
.acct-oauth-btn:active{transform:scale(.97);background:#f7f7f8;}
.acct-oauth-btn.apple{background:#000;border-color:#000;color:#fff;}
.acct-oauth-btn.apple:active{background:#1c1c1e;}
.acct-oauth-btn.apple svg{width:20px;height:20px;flex:0 0 20px;fill:currentColor;position:relative;top:-2px;}
.acct-oauth-divider{display:flex;align-items:center;gap:12px;margin:14px 0 0;}
.acct-oauth-divider::before,.acct-oauth-divider::after{content:'';flex:1;height:1px;background:#e6e2ec;}
.acct-oauth-divider span{font-size:var(--m-fs-2xs);color:var(--m-muted);text-transform:uppercase;letter-spacing:.06em;}
.acct-auth-error.info{color:var(--m-ink);}
.acct-sheet-hint{margin:0;font-size:var(--m-fs-xs);line-height:1.5;color:#2c2727;}
.acct-wlog{border:1px solid #c7c6cb;border-radius:var(--m-r-sm);overflow:hidden;background:var(--m-card);}
.acct-wlog-row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;font-size:var(--m-fs-sm);color:var(--m-ink);border-top:1px solid rgba(0,0,0,.06);}
.acct-wlog-row:first-child{border-top:0;}
.acct-wlog-row .d{color:var(--m-muted);}
.acct-wlog-row .d b{color:var(--m-ink);font-weight:600;}
.acct-wlog-empty{padding:11px 14px;font-size:var(--m-fs-2xs);color:var(--m-muted);}
.acct-revert{align-self:flex-start;background:none;border:0;color:var(--m-orange);font-size:var(--m-fs-xs);font-weight:600;font-family:inherit;padding:2px 0;cursor:pointer;}
.acct-revert[hidden]{display:none;}
/* Przypomnienie o treningu — iOS-style toggle. Ciągle używany element =
   bez wow-efektu (pkt 1 checklisty): kolor przez `ease`, pozycja gałki
   przez var(--m-dur-quick) var(--m-ease), zgodnie z tabelą tokenów ruchu. */
.acct-toggle-row{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:10px 0;font-size:var(--m-fs-base);color:var(--m-ink);font-family:inherit;cursor:pointer;}
.acct-toggle{position:relative;width:46px;height:28px;border-radius:var(--m-r-pill);background:#d8d5df;transition:background-color var(--m-dur-quick) ease;flex-shrink:0;}
.acct-toggle.on{background:var(--m-orange);}
.acct-toggle-knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transform:translateX(0);transition:transform var(--m-dur-quick) var(--m-ease);}
.acct-toggle.on .acct-toggle-knob{transform:translateX(18px);}
/* GYM finish — calories row */
.gymfin-kcal{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--m-panel);border:1px solid #e6e2ec;border-radius:var(--m-r-sm);padding:11px 14px;margin-top:8px;font-family:inherit;cursor:pointer;text-align:left;}
.gymfin-kcal[hidden]{display:none;}
.gymfin-kcal-l{display:flex;flex-direction:column;gap:3px;min-width:0;}
.gymfin-kcal-k{font-size:var(--m-fs-2xs);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--m-muted);}
.gymfin-kcal-v{font-size:var(--m-fs-xl);font-weight:600;color:var(--m-ink);line-height:1;}
.gymfin-kcal-edit{display:flex;align-items:center;gap:6px;flex-shrink:0;border:1px solid #e6e2ec;border-radius:var(--m-r-pill);padding:6px 12px;font-size:var(--m-fs-xs);font-weight:600;color:var(--m-ink);background:var(--m-card);}
.gymfin-kcal-edit[hidden]{display:none;}
.gymfin-kcal-edit .ph{width:13px;height:13px;}
/* History detail — calories row */
.histv2-wkcal{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--m-card);border:1px solid #e6e2ec;border-radius:var(--m-r-sm);padding:11px 13px;margin-top:10px;cursor:pointer;}
.histv2-wkcal-k{margin:0 0 3px;font-size:var(--m-fs-2xs);letter-spacing:.08em;text-transform:uppercase;color:var(--m-muted);}
.histv2-wkcal-v{margin:0;font-size:var(--m-fs-md);font-weight:600;color:var(--m-ink);}
.histv2-wkcal-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.histv2-wkcal-chip{font-size:var(--m-fs-2xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--m-orange);background:#ffe9e3;border-radius:var(--m-r-pill);padding:3px 8px;}
.histv2-wkcal-was{font-size:var(--m-fs-2xs);color:var(--m-muted);text-decoration:line-through;}
.histv2-wkcal-tag{font-size:var(--m-fs-2xs);color:var(--m-muted);text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;}
.kcal-watch-tag{display:inline-flex;align-items:center;gap:4px;}
.kcal-watch-tag .ph{display:inline-flex;width:12px;height:12px;flex-shrink:0;}
.kcal-watch-tag .ph svg{display:block;width:12px;height:12px;}
/* Stats — calories + weight-trend cards (neutral, not the orange YTD shell) */
.statsv2-kcard{background:var(--m-card);border-radius:var(--m-r-md);padding:18px 18px 16px;}
.statsv2-krow{display:flex;gap:8px;align-items:stretch;}
.statsv2-krow > .statsv2-kcard{flex:1;min-width:0;}
.statsv2-kcard--half{padding:16px 14px 14px;}
.statsv2-kcard--half .statsv2-kcard-num{font-size:var(--m-fs-xl);}
.statsv2-kcard--half .statsv2-kcard-num-row{gap:9px;}
.statsv2-kcard--half .statsv2-kcard-num-row .ph{width:24px;height:24px;}
.statsv2-kcard--half .statsv2-kcard-delta{line-height:1.45;}
.statsv2-kcard-eyebrow{margin:0 0 10px;font-size:var(--m-fs-2xs);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--m-muted);}
.statsv2-kcard-num-row{display:flex;align-items:center;gap:12px;}
.statsv2-kcard-num-row .ph{width:32px;height:32px;color:var(--m-orange);flex-shrink:0;}
.statsv2-kcard-num-row .ph svg{display:block;width:100%;height:100%;}
.statsv2-kcard-num{font-size:var(--m-fs-2xl);font-weight:600;color:var(--m-ink);letter-spacing:-.02em;line-height:1;}
.statsv2-kcard-num small{font-size:var(--m-fs-base);font-weight:400;color:var(--m-muted);margin-left:4px;}
.statsv2-kcard-delta{margin:8px 0 0;font-size:var(--m-fs-2xs);color:var(--m-muted);}
.statsv2-kcal-spark{width:100%;height:54px;margin-top:10px;display:block;}
/* "Co nowego" v2 (Figma node 185:14176) — backdrop values copied
   exactly from .exv2-overlay (same rgba+blur already established for
   this app's other full-screen popups), everything else is new. */
.wnv2-overlay{background:rgba(52,57,65,.88);-webkit-backdrop-filter:blur(4.85px);backdrop-filter:blur(4.85px);padding:10px;}
.wnv2-box{background:var(--m-panel);color:var(--m-ink);border-radius:var(--m-r-md);padding:18px;max-width:355px;width:100%;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;gap:24px;box-sizing:border-box;}
.wnv2-header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.wnv2-header-title{display:flex;align-items:center;gap:11px;}
.wnv2-header-icon{width:40px;height:40px;color:var(--m-orange);flex-shrink:0;}
.wnv2-header-icon svg{display:block;width:100%;height:100%;}
.wnv2-header h3{margin:0;font-size:var(--m-fs-lg);font-weight:400;letter-spacing:.8px;color:var(--m-ink);}
.wnv2-close{width:24px;height:24px;color:var(--m-ink);flex-shrink:0;cursor:pointer;}
.wnv2-close svg{display:block;width:100%;height:100%;}
.wnv2-scroll{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:24px;}
.wnv2-card{border-radius:var(--m-r-md);padding:14px;box-sizing:border-box;background:var(--m-card);}
.wnv2-card.hero{background:var(--m-orange);}
.wnv2-card-version{margin:0 0 7px;font-size:var(--m-fs-2xs);font-weight:500;letter-spacing:.4px;color:var(--m-orange);}
.wnv2-card.hero .wnv2-card-version{color:rgba(255,255,255,.8);}
.wnv2-card-title{margin:0 0 7px;font-size:var(--m-fs-base);font-weight:500;letter-spacing:.56px;color:var(--m-orange);}
.wnv2-card.hero .wnv2-card-title{color:#fff;}
.wnv2-card-text{margin:0;font-size:var(--m-fs-xs);line-height:1.5;color:#000;}
.wnv2-card.hero .wnv2-card-text{color:#fff;}
.wnv2-card-list{margin:0;padding-left:16px;font-size:var(--m-fs-xs);line-height:1.6;color:#000;}
.wnv2-card.hero .wnv2-card-list{color:#fff;}
.wnv2-card-list li{margin-bottom:4px;}
.wnv2-card-list li:last-child{margin-bottom:0;}
.wnv2-card-text + .wnv2-card-list{margin-top:8px;}
/* Stacked title — when a card holds MORE THAN ONE featured entry (e.g. two
   AI items in the same version), each one after the first gets its own
   title + divider instead of just concatenating text. */
.wnv2-card-title--stacked{margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);}
.wnv2-card.hero .wnv2-card-title--stacked,.wnv2-card--ai .wnv2-card-title--stacked{border-top-color:rgba(255,255,255,.15);}
/* AI changelog entries get the same black/gradient/glow identity as the
   Trener AI card/popup/account-panel section — driven by entry.ai:true in
   CHANGELOG (Maciej, 2026-09-17: every AI-related entry, not a one-off for
   a single version), rendered as its OWN card, separate from non-AI items
   in the same version (see renderWhatsNewCard()). */
.wnv2-card--ai{
  background:linear-gradient(#000,#000) padding-box, linear-gradient(142deg,#FA1228 0%,#5A00D1 83%) border-box;
  border:1px solid transparent;
  box-shadow:inset 0 0 33px rgba(161,0,255,.94),inset 0 0 11.4px rgba(222,116,255,.5);
}
.wnv2-card--ai .wnv2-card-version{color:rgba(255,255,255,.7);}
.wnv2-card--ai .wnv2-card-title{color:#fff;}
.wnv2-card--ai .wnv2-card-text{color:#fff;}
.wnv2-card--ai .wnv2-card-list{color:#fff;}
.backup-hint{padding:0 20px;margin-top:10px;font-size:var(--m-fs-2xs);line-height:1.5;color:rgba(255,255,255,.5);}

/* ---------- "Historia zmian" sheet — full numbered CHANGELOG, reached
   from the account panel (see renderChangelogHistorySheet()). Same sheet
   shell as weightSheet/bodyDataSheet (fbv2-header + X close), plain
   numbered rows instead of wnv2's big per-version cards. ---------- */
.chl-list{display:flex;flex-direction:column;}
.chl-row{display:flex;gap:12px;padding:16px 0;border-top:1px solid #e6e2ec;}
.chl-row:first-child{border-top:0;padding-top:2px;}
.chl-num{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--m-card);
  border:1px solid #e6e2ec;color:var(--m-muted);font-size:var(--m-fs-2xs);font-weight:600;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;margin-top:1px;
}
.chl-body{min-width:0;flex:1;}
.chl-meta{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.chl-ver{font-size:var(--m-fs-2xs);font-weight:600;letter-spacing:.03em;color:var(--m-orange);font-variant-numeric:tabular-nums;}
.chl-badge{
  font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--m-orange);background:#ffe9e3;border-radius:var(--m-r-pill);padding:2px 7px;
}
.chl-title{margin:0 0 4px;font-size:var(--m-fs-sm);font-weight:600;color:var(--m-ink);line-height:1.35;}
.chl-text{margin:0;font-size:var(--m-fs-xs);line-height:1.55;color:var(--m-ink);opacity:.82;}
.chl-sub{margin:6px 0 0;padding-left:15px;font-size:var(--m-fs-xs);line-height:1.55;color:var(--m-muted);}
.chl-sub li{margin-bottom:3px;}
.chl-sub li:last-child{margin-bottom:0;}
.chl-end{text-align:center;font-size:var(--m-fs-2xs);color:var(--m-muted);padding:14px 0 2px;}

/* ---------- misc ---------- */
/* Figma 448:5703 — black bubble, full width minus 20px gutters, left-aligned
   12px Geist. Line-height loosened from Figma's 12.12px so a wrapped
   message stays readable; vertical padding trimmed to keep the 1-line
   height at ~36px like the design. */
.toast{position:fixed;left:50%;bottom:110px;width:min(349px, calc(100% - 40px));box-sizing:border-box;transform:translateX(-50%) translateY(20px);background:#000;color:#fdfbff;
  padding:10px 16px;border-radius:8.65px;font-family:'Geist',sans-serif;font-size:var(--m-fs-xs);font-weight:400;line-height:1.35;text-align:left;opacity:0;pointer-events:none;transition:opacity var(--m-dur-fade) ease,transform var(--m-dur-fade) var(--m-ease);z-index:9700;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (prefers-reduced-motion: reduce){ .toast,.toast.show{transform:translateX(-50%);} }

.rotate-lock-overlay{display:none;position:fixed;inset:0;z-index:99999;background:var(--bg);color:var(--light);
  flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:0 40px;}
.rotate-lock-icon{width:44px;height:70px;border:3px solid var(--light);border-radius:9px;position:relative;transform:rotate(90deg);}
.rotate-lock-icon::after{content:'';position:absolute;left:50%;bottom:8px;width:14px;height:3px;border-radius:2px;background:var(--light);transform:translateX(-50%);}
.rotate-lock-overlay p{font-size:var(--m-fs-base);font-weight:600;line-height:1.5;max-width:280px;margin:0;}
@media (orientation: landscape) and (pointer: coarse){
  .rotate-lock-overlay{display:flex;}
}

.plan-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:flex-end;}
.plan-modal.open{display:flex;}
.plan-modal-inner{background:var(--card);width:100%;max-height:82vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;}
.plan-modal-inner h3{margin:14px 0 8px;font-size:var(--m-fs-base);letter-spacing:.4px;text-transform:uppercase;}
.plan-modal table{width:100%;border-collapse:collapse;font-size:var(--m-fs-2xs);margin-bottom:10px;}
.plan-modal td,.plan-modal th{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;}
.plan-modal-close{background:var(--orange);border:none;color:#fff;border-radius:var(--m-r-pill);padding:10px 18px;font-weight:700;font-size:var(--m-fs-sm);width:100%;margin-top:10px;cursor:pointer;}

.new-ex-form .field{margin-bottom:10px;}
.new-ex-form .row2{display:flex;gap:10px;}
.new-ex-form .btns{display:flex;gap:10px;margin-top:6px;}
.new-ex-form .btns button{flex:1;border:none;border-radius:var(--m-r-pill);padding:11px;font-weight:700;font-size:var(--m-fs-xs);cursor:pointer;font-family:inherit;}
.new-ex-form .btns .cancel{background:var(--light-2);color:var(--text-dark);}
.new-ex-form .btns .save{background:var(--orange);color:#fff;}
.new-ex-form .btns .save.hidden{display:none;}
.icon-suggest{display:flex;align-items:center;gap:10px;background:var(--tip);border-radius:10px;padding:8px 12px;margin:-2px 0 10px;}
.icon-suggest.hidden{display:none;}
.icon-suggest img{width:34px;height:34px;border-radius:8px;flex-shrink:0;}
.icon-suggest span{font-size:var(--m-fs-xs);font-weight:700;color:var(--text-dark);opacity:.75;}

/* ============================================================
   DASHBOARD — home screen of the Figma "v3" ("Mekkio") redesign,
   now the app's main layout (the app boots straight here; see the
   previewMode note near the router). Scoped entirely under
   .dash-* / #view-dashboard: its own font (Geist) and color set,
   deliberately not touching the app-wide --bg/--card/--orange
   tokens the old (now dead-code) screens still use.
   ============================================================ */
#view-dashboard{
  min-height:100vh;
  background:
    radial-gradient(120% 55% at 55% 14%, rgba(247,190,110,.55) 0%, rgba(247,190,110,0) 55%),
    radial-gradient(90% 45% at 88% 28%, rgba(244,190,205,.4) 0%, rgba(244,190,205,0) 60%),
    radial-gradient(100% 55% at 8% 78%, rgba(244,190,205,.32) 0%, rgba(244,190,205,0) 60%),
    var(--m-bg);
}
/* top padding matches .dash-chat-btn's own `top` (16px + safe area) so the
   greeting's first line sits level with the feedback circle.
   Flex column + min-height:100dvh so that when the content is shorter than
   the screen the slack collects under the greeting (.dash-hero margin-top:
   auto) and the last tile stays anchored: padding-bottom 126px = the nav's
   20px bottom offset + ~82px height + 24px breathing room, so the week
   card's bottom line sits 24px above the menu. renderDashboard() sizes its
   scroll check off the natural content height, not this padded box. */
.dash-root{position:relative;display:flex;flex-direction:column;min-height:100dvh;box-sizing:border-box;padding:calc(16px + var(--top-inset)) 10px 126px;}
/* Scrollable state only (content genuinely overflows, e.g. "Trener AI"
   expanded on a short phone): .dash-root's own 126px was tuned for the
   PINNED case above (margin-top:auto collapses the slack, last tile
   settles against this padding). Once real scrolling is in play, .app's
   own shared padding-bottom (110px, every scrolling route relies on it
   for nav clearance — see the .app padding-bottom comment near
   #bottomNav) is what actually determines the resting gap at max scroll,
   and the two stack, so 126px here would double up and leave a much
   bigger gap than intended. 12px is the measured amount that lands the
   last tile's bottom exactly 20px above the nav on top of .app's 110px
   (Maciej, 2026-09-16: wanted a hard 20px stop, not the original ~8px). */
html.dashboard-scrollable .dash-root{padding-bottom:12px;}
/* Safari/WebKit can size an inline <svg> with no explicit width/height
   to 0 inside a flex container (spec's "defaults to 100%" isn't applied
   reliably) — force it everywhere in this screen as a CSS-layer backstop,
   on top of the explicit width/height attributes on each icon's own svg. */
.dash-root .ph{display:block;}
.dash-root .ph svg{display:block;width:100%;height:100%;}
/* Chat button — one rule for every v2 screen (audit W5). Was copy-pasted
   per screen as .dash- / .gymv2- / .plansv2- / .histv2- / .statsv2-chat-btn.
   Dashboard keeps it floating top-right; the four subpages (Figma node
   191:703) now carry it inline as the trailing element of the screen
   header row, so it sits on one line with the back arrow + title. */
.dash-chat-btn, .gymv2-chat-btn, .plansv2-chat-btn, .histv2-chat-btn, .statsv2-chat-btn{
  width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease);flex-shrink:0;
}
.dash-chat-btn{position:absolute;top:calc(16px + var(--top-inset));right:10px;}
.gymv2-chat-btn, .histv2-chat-btn{margin-left:auto;}
.dash-chat-btn:active, .gymv2-chat-btn:active, .plansv2-chat-btn:active, .histv2-chat-btn:active, .statsv2-chat-btn:active{transform:scale(.9);}
.dash-chat-btn .ph, .gymv2-chat-btn .ph, .plansv2-chat-btn .ph, .histv2-chat-btn .ph, .statsv2-chat-btn .ph{width:24px;height:24px;color:var(--m-orange);}
/* account entry reuses .dash-chat-btn's position/size but the glyph is a
   self-contained badge SVG (orange disc + white user) — no button bg, full-bleed icon. */
.dash-acct-btn, .gymv2-acct-btn, .plansv2-acct-btn, .histv2-acct-btn, .statsv2-acct-btn{background:none;padding:0;}
.dash-acct-btn{width:48px;height:48px;}
.dash-acct-btn .ph{width:48px;height:48px;}
/* subpage headers: keep the row's 40px scale, glyph fills the badge */
.gymv2-acct-btn .ph, .plansv2-acct-btn .ph, .histv2-acct-btn .ph, .statsv2-acct-btn .ph{width:40px;height:40px;}
/* greeting hugs the top (see .dash-root padding). margin-bottom is the
   MINIMUM gap to the first tile (used as-is when the dashboard scrolls);
   when it fits on one screen, .dash-hero's margin-top:auto adds the extra
   slack here so the stack breathes and the last tile anchors to the menu. */
.dash-header{width:85%;margin-bottom:36px;}
.dash-hi{margin:0 0 4px;font-size:var(--m-fs-md);font-weight:400;color:var(--m-ink);}
.dash-headline{margin:0;font-size:var(--m-fs-2xl);line-height:1.15;font-weight:600;color:var(--m-ink);letter-spacing:-.02em;}

/* Section label + card eyebrow — one spec each (audit W4). The per-screen
   selectors keep only their own margins; shared typography + the light/dark
   colour split live here. Base eyebrow colour is --m-muted (light cards);
   the second list overrides to white for eyebrows on a coloured card. */
.gymv2-section-head p, .gymv2-done-head, .plansv2-section-label, .histv2-section-label,
.plansv2-customize-label, .pev2-section-name, .pev2-section-num{
  font-size:var(--m-fs-base);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--m-ink);
}
.dash-eyebrow, .dash-mini-label, .gymv2-plan-eyebrow, .plansv2-customize-hero-eyebrow,
.statsv2-ring-eyebrow, .statsv2-bar-eyebrow, .statsv2-ytd-eyebrow,
.statsv2-record-eyebrow, .statsv2-detail-chart-eyebrow, .statsv2-log-eyebrow{
  font-size:var(--m-fs-2xs);font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--m-muted);
}
.dash-eyebrow, .gymv2-plan-eyebrow, .plansv2-customize-hero-eyebrow,
.statsv2-ring-eyebrow, .statsv2-ytd-eyebrow, .statsv2-record-eyebrow{
  color:rgba(255,255,255,.82);
}
.dash-eyebrow{margin:0;}

.dash-hero{background:var(--m-orange);border-radius:var(--m-r-md);padding:14px;color:#fff;margin-top:auto;margin-bottom:8px;}
.dash-hero-stats{display:flex;flex-direction:column;gap:8px;margin:10px 0 12px;}
.dash-hero-row{display:flex;align-items:center;gap:16px;}
.dash-hero-row .ph{width:36px;height:36px;flex-shrink:0;}
.dash-hero-num{margin:0;font-size:var(--m-fs-hero);font-weight:400;letter-spacing:-.02em;}
.dash-hero-num small{font-size:var(--m-fs-base);font-weight:400;color:rgba(255,255,255,.8);margin-left:4px;}
.dash-hero-badges{display:flex;gap:12px;flex-wrap:wrap;}
.dash-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 18px;border-radius:var(--m-r-pill);font-size:var(--m-fs-xs);font-weight:600;}
.dash-badge.outline{border:1px solid rgba(255,255,255,.8);color:#fff;}
.dash-badge.fill{background:rgba(255,255,255,.85);color:var(--m-orange);}
.dash-badge.fill .ph{width:16px;height:16px;}

.dash-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.dash-plan-card{background:var(--m-plan-mid);border-radius:var(--m-r-md);padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:14px;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease);}
.dash-plan-card:active{transform:scale(.97);}
.dash-plan-name{margin:0 0 4px;font-size:var(--m-fs-lg);font-weight:500;line-height:1.2;letter-spacing:.02em;text-transform:uppercase;}
.dash-plan-count{margin:0;font-size:var(--m-fs-base);font-weight:300;color:rgba(255,255,255,.85);}
.dash-mini-col{display:flex;flex-direction:column;gap:8px;}
.dash-mini-card{background:var(--m-card);border-radius:var(--m-r-md);padding:12px 14px;}
.dash-mini-label{margin:0 0 6px;}
.dash-mini-row{display:flex;align-items:flex-end;justify-content:space-between;}
.dash-mini-num{margin:0;font-size:var(--m-fs-xl);font-weight:400;color:var(--m-ink);}
.dash-mini-row .ph{width:39px;height:31px;color:var(--m-orange);}
.dash-mini-sub{margin:2px 0 0;font-size:var(--m-fs-2xs);font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--m-muted);}
.dash-trend{display:flex;align-items:flex-end;gap:2px;height:27px;}
.dash-trend span{flex:1;min-width:3px;border-radius:3px;background:var(--m-orange);transform-origin:bottom;}

.dash-week-card{background:var(--m-plan-hard);border-radius:var(--m-r-md);padding:14px;color:#fff;}
.dash-week-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.dash-week-count{margin:0;font-size:var(--m-fs-xs);font-weight:700;}
.dash-week-days{display:flex;justify-content:space-between;}
.dash-week-day{display:flex;flex-direction:column;align-items:center;gap:6px;}
.dash-week-day span:first-child{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.dash-week-day.rest span:first-child{background:rgba(255,255,255,.101961);}
/* Same three plan states as the History calendar (Figma 177:10109) — see
   renderDashboard()'s dashWeekDays block for the priority logic. */
.dash-week-day.planned span:first-child{border:1.5px solid rgba(255,255,255,.75);}
.dash-week-day.missed span:first-child{border:1.5px dashed var(--m-plan-accent);}
.dash-week-day.done span:first-child{background:var(--m-plan-accent);}
.dash-week-day span:first-child .ph{width:30px;height:30px;display:block;flex-shrink:0;}
.dash-week-day span:first-child .ph svg{display:block;width:100%;height:100%;}
.dash-week-day.done span:first-child .ph{color:#fff;}
.dash-week-day.today span:first-child{background:#fff;border:none;}
.dash-week-day.today span:first-child .ph{color:var(--m-plan-hard);}
/* Ring around "today", only when today is also a plan day — same
   white-wins-but-don't-hide-the-plan-info treatment as the calendar. */
.dash-week-day.today.has-ring span:first-child{outline:1.5px solid #fff;outline-offset:2px;}
.dash-week-day em{font-style:normal;font-size:var(--m-fs-2xs);color:rgba(255,255,255,.85);}

/* AI asystent — "Trener AI" card (Figma node 320:16638, "AI BOX" — originally
   an inline accordion; Maciej 2026-09-16 moved the actual content into a
   popup, see .ai-popup-* below, since right after a workout you want to
   rest, not read a critique — this stays a quiet, collapsed teaser on the
   Dashboard until tapped on your own terms). Black fill + a gradient border
   painted with the classic two-layer trick (border:solid transparent, two
   background layers clipped to padding-box / border-box) since CSS can't
   put a gradient directly on border-color, plus the design's inset purple
   glow — same treatment reused on .ai-popup-box for a consistent identity. */
.dash-ai-card{border-radius:var(--m-r-md);padding:16px;color:#fff;margin-bottom:8px;
  border:1px solid transparent;
  background:linear-gradient(#000,#000) padding-box, linear-gradient(142deg,#FA1228 0%,#5A00D1 83%) border-box;
  box-shadow:inset 0 0 33px rgba(161,0,255,.94),inset 0 0 11.4px rgba(222,116,255,.5);
}
.dash-ai-head{display:flex;align-items:center;justify-content:space-between;width:100%;
  background:none;border:none;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer;
}
.dash-ai-head-left{display:flex;align-items:center;gap:15px;}
.dash-ai-head-left .ph{width:16px;height:16px;flex-shrink:0;color:#fff;}
.dash-ai-head .dash-eyebrow{margin:0;}
.dash-ai-caret{width:12px;height:12px;flex-shrink:0;color:#fff;transform:rotate(-90deg);}

/* Short phones: the 390×844 tuning + a real ~50px notch inset tips a 3-line
   greeting past one screen on an iPhone 13 mini / SE, so renderDashboard()
   flips on .dashboard-scrollable and the dashboard starts to move. Reclaim
   ~44px of the flexible spacing to make it fit again; padding-bottom (the
   24px gap above the nav) is kept — the greeting gap is what gives.
   Driven by a JS class, NOT `@media (max-height)`: Safari reports a shrunken
   viewport height while its URL bar is up, so a media query fires this on
   big phones too (17 Pro in a browser tab). renderDashboard() adds
   .dash-compact only when the real content actually overflows. */
html.dash-compact .dash-root{padding-top:calc(12px + var(--top-inset));}
html.dash-compact .dash-header{margin-bottom:18px;}
html.dash-compact .dash-headline{font-size:var(--m-fs-xl);line-height:1.1;}
html.dash-compact .dash-hero{padding:12px;}
html.dash-compact .dash-hero-stats{margin:8px 0;gap:6px;}
html.dash-compact .dash-grid2{gap:6px;margin-bottom:6px;}
html.dash-compact .dash-week-card{padding:12px;}
html.dash-compact .dash-week-head{margin-bottom:10px;}

/* ---- subtle motion: staggered reveal on entry, bars grow in, checks pop ---- */
@media (prefers-reduced-motion: no-preference){
  @keyframes dashRise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  /* chat-btn + screen header rise-in, every v2 screen (audit W5 — was 5 copies) */
  .dash-chat-btn,.dash-header,
  .gymv2-chat-btn,.gymv2-header,
  .plansv2-chat-btn,.plansv2-header,
  .histv2-chat-btn,.histv2-header,
  .statsv2-chat-btn,.statsv2-header{animation:dashRise var(--m-dur-in) var(--m-ease) backwards;}
  /* Each "tile" card fades in on its own — renderDashboard() sets a slightly
     randomized animation-delay per element so the stagger feels alive
     instead of a mechanically identical sequence every time. Longer travel
     + duration than dashRise above so the deceleration at the tail end
     actually reads instead of flashing by. */
  @keyframes dashTileRise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  .dash-hero,.dash-plan-card,.dash-mini-card,.dash-week-card,.dash-ai-card{animation:dashTileRise var(--m-dur-tile) var(--m-ease) backwards;}

  /* Weekly-progress day circles fade in one after another, timed to start
     only once the .dash-week-card itself has mostly finished revealing —
     renderDashboard() sets --day-base on #dashWeekDays to the card's own
     (randomized) delay + a buffer, and --i on each circle for the stagger. */
  @keyframes dashDayIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .dash-week-day{animation:dashDayIn var(--m-dur-in) var(--m-ease) backwards;animation-delay:calc(var(--day-base,650ms) + var(--i,0) * 70ms);}

  @keyframes dashBarGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  .dash-trend span{animation:dashBarGrow var(--m-dur-in) var(--m-ease) backwards;animation-delay:calc(var(--i,0) * 18ms + .2s);}

}

/* ============================================================
   GYM v2 — second screen of the "v3" Figma redesign (see
   [[project_thryve_roadmap]] for the preview-mode routing this
   plugs into). Unlike Dashboard, this screen scrolls normally —
   it has far more content than fits one iPhone screen.
   ============================================================ */
#view-gym-v2{min-height:100vh;background:var(--m-panel);}
.gymv2-panel{background:var(--m-panel);border-radius:0 0 26px 26px;padding:calc(16px + var(--top-inset)) 10px 28px;position:relative;}
/* Screen header — one spec for GYM / Plans / History / Stats (audit W5).
   Plans + Stats wrap the icon+h1 in a .*-header-title (their .*-header is a
   space-between row); GYM + History put it straight on .*-header.
   Figma node 191:703 shrank the title icon (40->32) + label
   (--m-fs-2xl -> --m-fs-xl) and put a back arrow ahead of them. */
.gymv2-header, .plansv2-header-title, .histv2-header, .statsv2-header-title{display:flex;align-items:center;gap:12px;}
/* direct-child only — the header row also holds the back arrow and the
   inline chat button, whose own .ph glyphs keep their 24px size. */
.gymv2-header > .ph, .plansv2-header-title > .ph, .histv2-header > .ph, .statsv2-header-title > .ph{width:32px;height:32px;color:var(--m-orange);flex-shrink:0;}
.gymv2-header h1, .plansv2-header-title h1, .histv2-header h1, .statsv2-header h1{margin:0;font-size:var(--m-fs-xl);font-weight:400;color:var(--m-ink);letter-spacing:-.02em;}
.gymv2-header, .histv2-header{margin-bottom:20px;}
/* Back arrow — returns to Dashboard from any of the four v2 tab screens.
   Sits before the title icon; its own ink glyph (not orange) so it reads
   as navigation chrome rather than part of the title lockup. 40px hit
   target for thumbs, nudged left so the 26px glyph lands near the screen
   edge like a native back control (barely shifts the title). */
.v2-hdr-back{background:none;border:none;padding:0;margin:0 0 0 -6px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent;transition:transform var(--m-dur-press-out) var(--m-ease);}
.v2-hdr-back:active{transform:scale(.88);}
.v2-hdr-back .ph{width:26px;height:26px;color:var(--m-ink);}
/* right-side control cluster (chat button + a close X) for the two headers
   that carry both — plan-editor-v2 and Stats detail. */
.v2-hdr-actions{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0;}

.gymv2-plan-card{background:var(--m-plan-mid);border-radius:var(--m-r-md);padding:16px;color:#fff;margin-bottom:24px;display:flex;flex-direction:column;gap:16px;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease);}
.gymv2-plan-card:active{transform:scale(.98);}
/* #1 — "Powtórz ostatni trening": shortcut sitting between the plan card
   and the exercise grid, prefills the session from the last saved workout. */
.gymv2-repeat{display:flex;align-items:center;gap:12px;width:100%;border:1px solid #d8d5e2;background:#fff;border-radius:var(--m-r-md);padding:12px 14px;font-family:inherit;cursor:pointer;text-align:left;margin:-4px 0 20px;transition:transform var(--m-dur-press-out) var(--m-ease);}
.gymv2-repeat:active{transform:scale(.98);}
.gymv2-repeat[hidden]{display:none;}
.gymv2-repeat-ico{width:34px;height:34px;flex-shrink:0;border-radius:var(--m-r-pill);background:#eae2fb;display:flex;align-items:center;justify-content:center;color:var(--m-orange);}
.gymv2-repeat-ico svg{width:17px;height:17px;display:block;}
.gymv2-repeat-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.gymv2-repeat-t{font-size:var(--m-fs-sm);font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#2c2727;}
.gymv2-repeat-s{font-size:var(--m-fs-2xs);color:#6c6b78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
/* repeat mode active — the button becomes the "you're repeating X, tap to
   go back" control. */
.gymv2-repeat.is-active{border-color:var(--m-orange);background:#fff4f1;}
.gymv2-repeat.is-active .gymv2-repeat-ico{background:#ffe0d7;}
.gymv2-repeat.is-active .gymv2-repeat-t{color:var(--m-orange);}
.gymv2-plan-card.hidden{display:none;}
.gymv2-plan-eyebrow{margin:0;}
.gymv2-plan-body{display:flex;flex-direction:column;}
.gymv2-plan-date{margin:0;font-size:var(--m-fs-2xs);color:#d8e0f5;}
.gymv2-plan-content{display:flex;flex-direction:column;gap:30px;}
.gymv2-plan-name-block{display:flex;flex-direction:column;gap:12px;}
.gymv2-plan-name{margin:0;font-size:22px;font-weight:400;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;}
.gymv2-plan-desc{margin:0;font-size:var(--m-fs-xs);line-height:1.4;}
.gymv2-plan-stats{display:flex;gap:16px;flex-wrap:wrap;}
.gymv2-plan-stat{display:flex;align-items:center;gap:12px;}
.gymv2-plan-stat .ph{width:16px;height:16px;color:#fff;flex-shrink:0;}
.gymv2-plan-stat span{font-size:var(--m-fs-base);}
/* Shared empty / no-content state — one treatment across GYM, History,
   Stats v2. Muted centred card on --m-card; the one actionable variant
   (.gymv2-no-plan) keeps a CTA pill, emphasis carried by the button. */
.gymv2-no-plan, .histv2-empty, .statsv2-empty{
  background:var(--m-card);border-radius:var(--m-r-md);
  padding:24px 18px;font-size:var(--m-fs-base);color:var(--m-muted);
  text-align:center;box-sizing:border-box;
}
.gymv2-no-plan{margin-bottom:24px;}
.gymv2-no-plan.hidden{display:none;}
.gymv2-no-plan p{margin:0 0 12px;}
.gymv2-no-plan .add-pill{margin:0 auto;}

.gymv2-section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;}
.gymv2-section-head.hidden{display:none;}
.gymv2-grid.hidden{display:none;}
.gymv2-edit-plan.hidden{display:none;}
/* rest day — no plan exercises today */
.gymv2-rest-note{margin:0 0 12px;font-size:var(--m-fs-sm);color:var(--m-muted);line-height:1.45;}
.gymv2-rest-note.hidden{display:none;}
.gymv2-section-head p{margin:0;}
.gymv2-edit-plan{background:var(--m-orange);border:none;border-radius:var(--m-r-pill);padding:6px 20px;width:140px;color:#fff;font-size:var(--m-fs-xs);font-weight:500;letter-spacing:.04em;text-align:center;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease);}
.gymv2-edit-plan:active{transform:scale(.95);}
