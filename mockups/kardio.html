</head><body>
<style>
/* ---- tylko ramka makiet: reszta stylu to prawdziwy CSS i tokeny z index.html (wklejone wyżej) ---- */
html,body{height:auto !important;overflow:auto !important;background:#2a2730 !important;touch-action:auto;}
.mk-layout{display:flex;gap:28px;align-items:flex-start;padding:28px;min-height:100vh;box-sizing:border-box;font-family:'Geist',system-ui,sans-serif;}
.mk-list{width:300px;flex:none;position:sticky;top:28px;color:#eee;display:flex;flex-direction:column;gap:6px;}
.mk-list h1{font-size:15px;font-weight:600;margin:0 0 6px;letter-spacing:.02em;}
.mk-list p.mk-note{font-size:12px;line-height:1.45;color:#b9b4c6;margin:0 0 10px;}
.mk-list button{font:inherit;font-size:13px;text-align:left;padding:9px 12px;border-radius:10px;border:1px solid #4a4658;background:#35313f;color:#eee;cursor:pointer;}
.mk-list button.on{background:#ff4a1c;border-color:#ff4a1c;color:#fff;}
.mk-list .mk-sub{margin-left:14px;font-size:12px;}
.mk-stage{display:flex;flex-direction:column;gap:12px;}
.mk-cap{color:#cfcadb;font-size:13px;max-width:375px;line-height:1.45;}
.mk-phone{width:375px;height:812px;position:relative;overflow:hidden;transform:translateZ(0);background:var(--m-red-page);border-radius:34px;box-shadow:0 20px 60px rgba(0,0,0,.45);flex:none;}
.mk-bg{position:absolute;inset:0;background:#e6e1f0;}
.mk-page{position:absolute;inset:0;overflow:auto;padding:24px 20px 40px;box-sizing:border-box;background:var(--m-panel);}
.mk-page.mk-dark{background:#1c1a22;}
.mk-steps{display:flex;gap:8px;flex:none;}
.mk-s{width:34px !important;height:34px !important;}
.mk-s svg{width:16px !important;height:16px !important;}
.lg-set.mk-metric{cursor:default;}
.mk-metric .lg-set-v{font-size:var(--m-fs-md);}
.mk-metric.is-empty .lg-set-v{color:#b8b8b8;}
.mk-derived{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.mk-hintline{margin:0;text-align:center;font-size:var(--m-fs-2xs);color:rgba(44,39,39,.71);line-height:1.4;}
.mk-cardio{text-align:left;width:100%;background:var(--m-panel);border:1px solid #e6e2ec;border-radius:var(--m-r-sm);padding:6px 14px;margin-top:8px;box-sizing:border-box;}
.mk-cardio-k{margin:8px 0 2px;font-size:var(--m-fs-2xs);letter-spacing:.1em;text-transform:uppercase;color:rgba(44,39,39,.71);}
.mk-cardio .histv2-ex-item:first-of-type{border-top:none;}
.mk-flag{display:inline-block;margin-left:6px;font-size:11px;padding:2px 8px;border-radius:99px;background:#fde8e1;color:#cd1200;}
.mk-cell-sub{font-size:11px;opacity:.8;}
</style>

<div class="mk-layout">
  <div class="mk-list" id="mkList"></div>
  <div class="mk-stage">
    <div class="mk-cap" id="mkCap"></div>
    <div class="mk-phone" id="mkPhone"></div>
  </div>
</div>

<script>
const PH = ICONS.PH, LG = ICONS.LG;
const ph = (n, c)=> `<span class="ph ${c||''}">${PH[n]||''}</span>`;
const IMG = s => `<img src="../icons/exercises/${s}.png" alt="">`;

/* ---------- dane przykładowe (statyczne) ---------- */
const EX = {
  treadmill:{name:'Treadmill', tag:'Kardio', icon:'treadmill', clock:'20:00', dur:'20:00'},
  bike:{name:'Stationary Bike', tag:'Kardio', icon:'stationary_bike', clock:'20:00', dur:'20:00'},
  rower:{name:'Rowing Machine', tag:'Kardio', icon:'rowing_machine', clock:'15:00', dur:'15:00'},
  rope:{name:'Jump Rope', tag:'Kardio', icon:'jump_rope', clock:'2:00', dur:'2:00'},
};

/* ---------- popup logowania (jak renderExercisePopupV2, tryb czasowy) ---------- */
function popupBox(ex, o){
  o = o || {};
  const sets = o.sets || [{v:'—',blank:true,active:true}];
  const setRows = sets.map((s,i)=>`<div class="lg-set-wrap"><div class="lg-set-del" aria-hidden="true">${LG.trash}</div>
    <button type="button" class="lg-set${s.blank?' is-blank':''}${s.active?' is-active':''}"><span class="lg-set-l">SERIA ${i+1}</span><span class="lg-set-v">${s.v}</span><span class="lg-set-c">${LG.check}</span></button></div>`).join('');
  const btns = o.phase === 'run'
    ? `<button type="button" class="lg-add lg-tm-main m-press">${o.paused?'Wznów':'Pauza'}</button>
       <div class="lg-tm-row"><button type="button" class="lg-add m-press">Zakończ</button><button type="button" class="lg-add m-press">Pomiń</button></div>`
    : `<button type="button" class="lg-add lg-tm-main m-press">Start</button>`;
  return `
    <div class="lg-bar">
      <button type="button" class="lg-circ">${LG.x}</button>
      <span class="lg-bar-title">TRENING</span>
      <div class="lg-bar-end"><button type="button" class="lg-circ fill">${LG.checkBig}</button></div>
    </div>
    <div class="lg-scroll">
      <div class="lg-head">
        <div class="lg-tags"><span class="lg-tag">${ex.tag}</span></div>
        <div class="lg-name-row"><div class="lg-name">${ex.name}</div><button type="button" class="lg-ic note">${LG.note}</button></div>
        <div class="lg-chips">
          <span class="lg-chip">${ph('stack')}<span>1 seria</span></span>
          <span class="lg-chip">${ph('arrow-clockwise')}<span>${ex.dur}</span></span>
        </div>
      </div>
      <div class="lg-tip"><span class="lg-tip-l">WSKAZÓWKA TRENINGOWA</span><span class="lg-tip-t">Zacznij spokojnie i podkręcaj stopniowo. Następnym razem spróbuj dołożyć minutę albo trochę tempa.</span></div>
      ${o.goal ? `<div class="mk-metric-goal"></div>` : ''}
      <div class="lg-block lg-tm">
        <span class="lg-lab">CZAS</span>
        <div class="lg-tm-clock${o.phase==='run'&&!o.paused?' is-run':''}">${o.clock||ex.clock}</div>
        <p class="lg-tm-msg"></p>
        <div class="lg-tm-btns">${btns}</div>
      </div>
      <div class="lg-setsec"><div class="lg-sets">${setRows}</div></div>
      <button type="button" class="lg-add">Dodatkowa seria</button>
    </div>`;
}
function popupShell(inner, subHtml){
  return `<div class="mk-bg"></div>
  <div class="onboard-overlay m-sheet-overlay m-sheet-entered" id="exercisePopupOverlayV2"><div class="m-sheet" id="exercisePopupSheetV2"><div class="m-sheet-grab"></div><div class="m-sheet-body" id="exercisePopupBoxV2">${inner}</div></div></div>
  ${subHtml||''}`;
}

/* ---------- sheet "Wpisz wyniki" (nowy; wiersze jak .lg-set, kroki jak .lg-step) ---------- */
function metricRow(label, val, unit, o){
  o = o || {};
  const empty = val === '' || val == null;
  return `<div class="lg-set-wrap"><div class="lg-set mk-metric${empty?' is-empty':''}${o.active?' is-active':''}">
    <span class="lg-set-l" style="width:96px">${label}</span>
    <span class="lg-set-v">${empty ? '—' : val}${empty ? '' : ` <small>${unit||''}</small>`}</span>
    <span class="mk-steps"><button type="button" class="lg-step mk-s">${LG.minus}</button><button type="button" class="lg-step mk-s">${LG.plus}</button></span>
  </div></div>`;
}
function resultsSheet(ex, o){
  const rows = (o.rows||[]).map(r=> metricRow(r[0], r[1], r[2], r[3])).join('');
  const derived = (o.derived||[]).map(d=>`<span class="lg-chip">${d}</span>`).join('');
  const kcalRow = `<div class="lg-set-wrap"><div class="lg-set mk-metric is-empty"><span class="lg-set-l" style="width:96px">KALORIE</span><span class="lg-set-v">— <small>z maszyny</small></span><span class="mk-steps"><button type="button" class="lg-step mk-s">${LG.minus}</button><button type="button" class="lg-step mk-s">${LG.plus}</button></span></div></div>`;
  return `<div class="onboard-overlay m-sheet-overlay lg-sub-overlay m-sheet-entered"><div class="m-sheet" id="exNoteSheetV2"><div class="m-sheet-grab"></div><div class="m-sheet-body" id="exNoteBoxV2" style="align-items:stretch;gap:0">
    <div class="lg-bar">
      <button type="button" class="lg-circ">${LG.x}</button>
      <span class="lg-bar-title">WYNIKI</span>
      <button type="button" class="lg-circ fill">${LG.checkBig}</button>
    </div>
    <div class="lg-scroll lg-sub-scroll">
      <div class="lg-name-row"><div class="lg-name">${ex.name}</div></div>
      <div class="lg-chips"><span class="lg-chip">${ph('clock-countdown')}<span>${o.time||ex.dur}</span></span></div>
      <div class="lg-sets" style="margin-top:6px">${rows}${o.noKcal?'':kcalRow}</div>
      ${derived ? `<div class="mk-derived">${derived}</div>` : ''}
      ${o.hint ? `<p class="mk-hintline">${o.hint}</p>` : ''}
      ${o.warn ? `<div class="lg-warn" style="margin:0">${o.warn}</div>` : ''}
      <p class="mk-hintline">Szare wartości to podpowiedź z poprzedniego razu. Wszystko jest opcjonalne, a kalorie wpisz tylko wtedy, gdy pokazuje je maszyna.</p>
      <button type="button" class="lg-add">Zapisz</button>
      <button type="button" class="lg-add" style="border-color:transparent">Pomiń</button>
    </div></div></div></div>`;
}

/* ---------- historia ---------- */
function histItem(icon, name, line, extra){
  return `<div class="histv2-ex-item"><span class="histv2-ex-ico">${IMG(icon)}</span><div class="histv2-ex-meta"><p class="histv2-ex-name">${name}</p><p class="histv2-ex-sets">${line}${extra||''}</p></div></div>`;
}
function histCard(items, o){
  return `<div class="histv2-card expanded">
    <div class="histv2-card-head"><div class="histv2-card-kind">${ph('barbell')}<span>GYM</span></div><div class="histv2-card-right"><span class="histv2-card-date">6 października 2026</span><span class="ph histv2-card-close">${PH.x}</span></div></div>
    <div class="histv2-wstat">
      <div class="histv2-wtile histv2-wtile--orange"><p class="k">Czas</p><p class="v">${o.time}<small>min</small></p></div>
      <div class="histv2-wtile histv2-wtile--blue"><p class="k">Ćwiczenia</p><p class="v">${o.ex}</p></div>
      <div class="histv2-wtile histv2-wtile--navy"><p class="k">Serie</p><p class="v">${o.sets}</p></div>
      <div class="histv2-wtile histv2-wtile--plain"><p class="k">${o.tileK||'Objętość'}</p><p class="v">${o.tileV}</p></div>
    </div>
    ${o.kcal ? `<div class="histv2-wkcal"><div><p class="histv2-wkcal-k">Kalorie</p><p class="histv2-wkcal-v">${o.kcal} kcal</p></div><span class="histv2-wkcal-tag">szacunek</span></div>` : ''}
    <div class="histv2-wex" style="margin-top:12px">${items}</div>
  </div>`;
}

/* ---------- podsumowanie treningu ---------- */
function finishScreen(o){
  return `<div class="gymfin-root visible"><div class="gymfin-panel">
    <div class="gymfin-topbar"><div class="gymfin-brand">${ph('barbell')}<span class="gymfin-brand-word">GYM</span></div><span class="gymfin-chat">${ph('chat-dots')}</span></div>
    <div class="gymfin-body"><div class="gymfin-inner" style="overflow:auto">
      <div class="gymfin-heads"><p class="gymfin-title">GRATULACJE</p><p class="gymfin-sub">TRENING ZOSTAŁ ZAPISANY</p></div>
      <div class="gymfin-stats">
        <div class="gymfin-stat gymfin-stat--orange"><p class="gymfin-stat-k">Czas</p><p class="gymfin-stat-v">${o.time}</p></div>
        <div class="gymfin-stat gymfin-stat--blue"><p class="gymfin-stat-k">Ćwiczenia</p><p class="gymfin-stat-v">${o.ex}</p></div>
        <div class="gymfin-stat gymfin-stat--navy"><p class="gymfin-stat-k">Serie</p><p class="gymfin-stat-v">${o.sets}</p></div>
        <div class="gymfin-stat gymfin-stat--plain"><p class="gymfin-stat-k">${o.tileK}</p><p class="gymfin-stat-v">${o.tileV}</p></div>
      </div>
      ${o.cardio ? `<div class="mk-cardio"><p class="mk-cardio-k">Na czas</p>${o.cardio}</div>` : ''}
      ${o.kcal ? `<button type="button" class="gymfin-kcal"><span class="gymfin-kcal-l"><span class="gymfin-kcal-k">${o.kcal[0]}</span><span class="gymfin-kcal-v">${o.kcal[1]}</span></span>${o.kcal[2] ? `<span class="gymfin-kcal-edit">${ph('pencil')}${o.kcal[2]}</span>` : ''}</button>` : ''}
      ${o.note ? `<p class="mk-hintline" style="margin-top:10px">${o.note}</p>` : ''}
    </div></div>
    <button type="button" class="gymfin-cta">Gotowe</button>
  </div></div>`;
}

/* ---------- statystyki ---------- */
function statsCardio(){
  return `<div class="mk-page" style="background:#1c1a22"><div class="statsv2-cards">
    <div class="statsv2-scard"><p class="statsv2-scard-eyebrow">Kardio · 7 dni</p><p class="statsv2-scard-num">1:25<small>h łącznie</small></p><p class="statsv2-scard-delta">łączny czas kardio</p></div>
    <div class="statsv2-krow">
      <div class="statsv2-kcard"><p class="statsv2-kcard-eyebrow">Dystans · 7 dni</p><div class="statsv2-kcard-num-row">${ph('chart-line-up')}<span class="statsv2-kcard-num">11,4<small>km</small></span></div><p class="statsv2-kcard-delta">bieżnia, rower, wioślarz</p></div>
      <div class="statsv2-kcard"><p class="statsv2-kcard-eyebrow">Sesje · 7 dni</p><div class="statsv2-kcard-num-row">${ph('stack')}<span class="statsv2-kcard-num">3</span></div><p class="statsv2-kcard-delta">z ćwiczeniami kardio</p></div>
    </div>
    <div class="statsv2-scard"><p class="statsv2-scard-eyebrow">Ostatnio</p>
      <div class="histv2-ex-item" style="border-top:none">${'<span class="histv2-ex-ico">'+IMG('treadmill')+'</span>'}<div class="histv2-ex-meta"><p class="histv2-ex-name" style="color:#2c2727">Treadmill</p><p class="histv2-ex-sets">20:00 · 3,2 km · 2%</p></div></div>
      <div class="histv2-ex-item">${'<span class="histv2-ex-ico">'+IMG('stationary_bike')+'</span>'}<div class="histv2-ex-meta"><p class="histv2-ex-name" style="color:#2c2727">Stationary Bike</p><p class="histv2-ex-sets">20:00 · 6,1 km · poz. 6</p></div></div>
      <div class="histv2-ex-item">${'<span class="histv2-ex-ico">'+IMG('rowing_machine')+'</span>'}<div class="histv2-ex-meta"><p class="histv2-ex-name" style="color:#2c2727">Rowing Machine</p><p class="histv2-ex-sets">15:00 · 3 120 m · 2:24 /500 m</p></div></div>
    </div>
  </div></div>`;
}

 {id:'s3a', sub:1, label:'3a. Wyniki: bieżnia', cap:'Po zakończeniu serii seria jest już zapisana z czasem. Arkusz tylko ją uzupełnia. Szare wartości = z poprzedniego razu. Prędkość wynika z dystansu i czasu.',

  render:()=> popupShell(popupBox(EX.bike,{sets:[{v:'20:00',blank:false}]}), resultsSheet(EX.bike,{rows:[['DYSTANS','6,1','km',{active:true}],['POZIOM','6','']],derived:['Prędkość 18,3 km/h']}))},
 {id:'s3c', sub:1, label:'3c. Wyniki: wioślarz', cap:'Dystans w metrach. Tempo /500 m wynika z dystansu i czasu.',
  render:()=> popupShell(popupBox(EX.rower,{sets:[{v:'15:00',blank:false}]}), resultsSheet(EX.rower,{rows:[['DYSTANS','3 120','m',{active:true}]],derived:['Tempo 2:24 /500 m']}))},
 {id:'s3d', sub:1, label:'3d. Wyniki: skakanka', cap:'Tylko liczba skoków, opcjonalnie.',
  render:()=> popupShell(popupBox(EX.rope,{sets:[{v:'2:00',blank:false},{v:'—',blank:true,active:true}]}), resultsSheet(EX.rope,{rows:[['SKOKI','240','',{active:true}]]}))},
 {id:'s9', label:'9. Bieżnia bez dystansu', cap:'Bez dystansu bieżni nie liczę kalorii osobno (jej minuty zostają w członie bazowym treningu). Podpowiedź zamiast liczby.',

 {id:'s6', label:'6. Brak masy ciała', cap:'Gdy nie ma masy ciała: żadnych kalorii, tylko zachęta (ta sama co dziś na ekranie końca treningu).',
  render:()=> popupShell(popupBox(EX.treadmill,{sets:[{v:'20:00',blank:false}]}), resultsSheet(EX.treadmill,{rows:[['DYSTANS','3,2','km',{active:true}],['NACHYLENIE','2','%']],derived:['Prędkość 9,6 km/h'],warn:'Dodaj masę ciała w koncie, żeby oszacować kalorie.'}))},
 {id:'s4', label:'4. Wiersz serii kardio w historii', cap:'Kalorie serii pokazuję tylko, gdy użytkownik wpisał je sam z maszyny (oznaczone „z maszyny”). Bez wpisu: sam czas i metryki.',
  render:()=> `<div class="mk-page" style="background:var(--m-panel)">${histCard(
     histItem('treadmill','Treadmill','20:00 · 3,2 km · 2%',' · 210 kcal <span class="mk-flag">z maszyny</span>') +
     histItem('stationary_bike','Stationary Bike','20:00 · 6,1 km · poz. 6') +
     histItem('rowing_machine','Rowing Machine','15:00 · 3 120 m · 2:24 /500 m') +

];

const list = document.getElementById('mkList');
list.innerHTML = `<h1>Mekkio · kardio (makiety)</h1><p class="mk-note">Statyczne, prawdziwy CSS i tokeny z index.html, 375 px. Do przeprojektowania w Figmie, więc czytelne, nie dopracowane.</p>` + STATES.map(s=>`<button type="button" data-id="${s.id}" class="${s.sub?'mk-sub':''}">${s.label}</button>`).join('');
function show(id){
  const s = STATES.find(x=>x.id===id) || STATES[0];
  document.getElementById('mkPhone').innerHTML = s.render();
  document.getElementById('mkCap').textContent = s.cap;
  list.querySelectorAll('button').forEach(b=> b.classList.toggle('on', b.dataset.id===s.id));
  history.replaceState(null,'','#'+s.id);
}
list.addEventListener('click', e=>{ const b = e.target.closest('button[data-id]'); if(b) show(b.dataset.id); });
show((location.hash||'').slice(1));
</script>
