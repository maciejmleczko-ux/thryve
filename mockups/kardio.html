.gymv2-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.gymv2-tile{position:relative;border-radius:var(--m-r-md);overflow:hidden;background:#fff;aspect-ratio:115.667/122;padding:0;border:none;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease);}
.gymv2-tile:active{transform:scale(.95);}
/* "Assigned to the active plan day" state — plan editor v2 only, see
   buildExerciseTileV2()'s 'selected' state. */
.gymv2-tile.gymv2-tile-selected{border:2px solid var(--m-orange);}
.gymv2-tile-check{position:absolute;top:6px;right:6px;width:18px;height:18px;z-index:1;}
.gymv2-tile-check svg{display:block;width:100%;height:100%;}
/* "Zamień na dziś" corner control on a GYM plan tile */
.gymv2-tile-swap{position:absolute;top:3px;right:3px;width:26px;height:26px;z-index:2;display:flex;align-items:center;justify-content:center;background:none;color:#5b5555;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease),color var(--m-dur-quick) ease;}
.gymv2-tile-swap svg{display:block;width:19px;height:19px;}
.gymv2-tile-swap:hover{color:#2c2727;}
.gymv2-tile-swap:active{transform:scale(.85);}
/* swapped: the whole tile gets an inset orange stroke; the corner glyph
   just turns orange, no backing. */
.gymv2-tile-swap.is-swapped{color:var(--m-orange);}
.gymv2-tile.gymv2-tile-swapped{box-shadow:inset 0 0 0 2px var(--m-orange);}
.gymv2-tile-swap:focus-visible{outline:2px solid var(--m-orange);outline-offset:1px;border-radius:6px;}
.gymv2-tile img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}
.gymv2-tile.custom-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#fff;}
.gymv2-tile.custom-tile .ph{width:24px;height:24px;color:var(--m-orange);}
/* "Wybierz inne ćwiczenie" (Figma node 174:6236) — sits right before
   the "Dodaj ćwiczenie" tile, same tile shape but a thin neutral
   border + dark magnifying-glass icon (vs. the add-tile's dashed
   orange border + plus) so the two read as distinct actions: pick
   from our library vs. add something brand new. */
/* Bakes its own bg/border/icon/label into EX_TILE_SEARCH_SVG (verbatim
   from Maciej, 2026-09-01) — same "whole tile is one SVG" treatment as
   .ex-tile.ex-tile-add's EX_TILE_ADD_SVG. */
.gymv2-tile.gymv2-search-tile{background:transparent;}
.gymv2-tile.gymv2-search-tile svg{width:100%;height:100%;display:block;}
/* GYM home mixes this whole-tile-is-an-SVG search tile with
   buildExerciseTileV2's .png-icon exercise tiles — match their taller
   aspect-ratio (115.667/136, not the plain .gymv2-tile 115.667/122) so
   it lines up with its neighbours instead of sitting visibly shorter. */
.gymv2-tile.gymv2-search-tile{aspect-ratio:115.667/136;}
/* height was a fixed 70px — fine on a full-width screen (GYM's own
   grid, plan editor v2, ~108px-wide tiles) but the exercise picker's
   tiles sit inside a narrower modal card and shrink to ~90px wide;
   a fixed 70px zone then eats ~84% of the tile instead of ~65%,
   crushing the label into wrapping/getting cut off (Maciej,
   2026-09-02, screenshots: "ikony sa za duze w wyszukiwarce"). 65% is
   .gymv2-tile's aspect-ratio (115.667/122) — expressed relatively so it
   holds regardless of how wide the tile actually renders. Icon is 58%
   (not 65%) so the taller tile's extra height goes to the label zone,
   giving 2-3 line exercise names room instead of the icon. */
.gymv2-tile-icon{width:100%;height:58%;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box;}
.gymv2-tile-icon svg{width:100%;height:100%;display:block;}
.gymv2-tile-icon img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;pointer-events:none;transform:scale(1.12);}
.gymv2-tile-label{font-size:var(--m-fs-2xs);font-weight:600;letter-spacing:.4px;text-transform:uppercase;text-align:center;color:#2c2727;line-height:1.15;padding:0 6px;}
/* PNG 3D icon set (buildExerciseTileV2's .png-icon modifier) needs a
   little more height than the flat SVG glyphs it replaced — the render
   reads small if it's squeezed into the same 58%/50% zone the thin
   line icons used. Tile grows a bit taller and the icon zone grows
   with it; label keeps its own space so long names still fit. */
.ex-tile.png-icon{aspect-ratio:115.667/136;gap:9px;}
.ex-tile.png-icon .gymv2-tile-icon{height:66%;}
#pickExerciseOverlayV2 .ex-tile.png-icon .gymv2-tile-icon{height:58%;}
/* The picker's tiles are narrower still than plan editor v2's (the
   .plansv2-customize-card's own 18px padding, stacked on the overlay's
   inset, eats more width than the full-screen editor's), so even 65%
   left three-line labels ("STRAIGHT-ARM PULLDOWN") clipped at the
   tile's bottom edge — Maciej, 2026-09-02: "zmniejsz je jeszcze
   troche - bo te 3 wiersze sie nie miesci". Scoped to this one modal
   rather than lowering the shared 65% (which is correctly sized for
   GYM's own grid and plan editor v2's wider tiles). */
#pickExerciseOverlayV2 .gymv2-tile-icon{height:50%;}
.gymv2-tile.custom-tile .t{font-size:var(--m-fs-2xs);font-weight:700;letter-spacing:.2px;text-transform:uppercase;text-align:center;padding:0 6px;color:#2c2727;}
/* Bakes its own dashed border/icon/label into EX_TILE_ADD_SVG
   (verbatim, same constant .ex-tile-add uses elsewhere) instead of the
   hand-approximated dashed-border+ph-icon+label this was before —
   Maciej sent the exact tile SVG (2026-09-01) for pixel parity with
   the plan editor's own add-tile. */
.gymv2-add-tile{background:transparent;}
.gymv2-add-tile svg{width:100%;height:100%;display:block;}
/* Same reasoning as .gymv2-search-tile above — matches
   buildExerciseTileV2's .png-icon tile height, not the plain
   .gymv2-tile one. */
.gymv2-tile.gymv2-add-tile{aspect-ratio:115.667/136;}

.gymv2-done-head{margin:40px 0 12px;}
.gymv2-done-head.hidden{display:none;}
.gymv2-done-list{display:flex;flex-direction:column;gap:4px;}
.gymv2-done-row{background:#fff;border-radius:var(--m-r-md);height:50px;padding:9px 13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border:none;width:100%;font-family:inherit;transition:transform var(--m-dur-press-out) var(--m-ease);}
.gymv2-done-row:active{transform:scale(.98);}
.gymv2-done-row-info{display:flex;align-items:center;gap:7px;}
.gymv2-done-row-info .ph{width:24px;height:24px;color:var(--m-orange);flex-shrink:0;}
.gymv2-done-row-info span{font-size:var(--m-fs-md);font-weight:700;letter-spacing:.16px;text-transform:uppercase;color:var(--m-ink);}
.gymv2-done-row-actions{display:flex;align-items:center;gap:11px;}
.gymv2-done-row-actions .ph{width:24px;height:24px;color:var(--m-muted);cursor:pointer;}

.gymv2-save-wrap{padding:20px 10px 0;display:flex;justify-content:center;}
/* Matches .pev2-save-fab (plan editor v2's "ZAPISZ PLAN") — plain
   white pill, text only, no badge/icon. Maciej, 2026-08-31: "zmien
   button zapisz trening na taki sam jak mamy w zapisz plan (bez
   ikonki)". Success feedback is the shared toast() saveWorkout()
   already fires ("Trening zapisany") — same as how savePlanEditor()
   confirms a save, no per-button animation needed. */
.gymv2-save{display:flex;align-items:center;justify-content:center;background:var(--m-orange);border:none;border-radius:var(--m-r-pill);width:100%;max-width:217px;padding:14px;font-size:var(--m-fs-md);font-weight:500;letter-spacing:.64px;color:#fff;cursor:pointer;font-family:inherit;transition:transform var(--m-dur-press-out) var(--m-ease);}
.gymv2-save:active{transform:scale(.97);}

/* Entrance motion — same idiom as the Dashboard: header fades/rises in,
   the plan card follows as one "tile", then exercise tiles and done-list
   rows cascade in one after another (reusing dashRise/dashTileRise/dashDayIn
   from the Dashboard's own rules above). The .gymv2-anim-in modifier class
   (added only by renderGymV2() on a real screen visit, not on every grid
   rebuild from logging a set — see renderGymGridV2()/renderGymDoneV2())
   keeps this from replaying on every in-session tile/list refresh. */
@media (prefers-reduced-motion: no-preference){
  .gymv2-plan-card,.gymv2-no-plan{animation:dashTileRise var(--m-dur-tile) var(--m-ease) backwards;animation-delay:.08s;}
  .gymv2-anim-in, .plansv2-anim-in{animation:dashDayIn var(--m-dur-in) var(--m-ease) backwards;}
}

/* ============================================================
   PLANS v2 — third screen of the "v3" preview (Figma node 116:2502).
   Browsing/creating/importing only — tapping a card, "+", or the import
   button hands off to the existing (not yet redesigned) plan editor /
   import-code modal, same pieces the old #view-plans screen already
   uses (openPlanEditor/openImportPlanCodeModal/sharePlan/
   toggleStarredPlan) — this screen is only a new list view on top of
   that same data. */
#view-plans-v2{min-height:100vh;background:var(--m-panel);}
.plansv2-root .ph{display:block;}
.plansv2-root .ph svg{display:block;width:100%;height:100%;}
.plansv2-panel{padding:calc(16px + var(--top-inset)) 10px 28px;position:relative;}
.plansv2-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.plansv2-close{width:24px;height:24px;color:var(--m-ink);cursor:pointer;flex-shrink:0;}
.plansv2-actions{display:flex;gap:10px;width:100%;margin-bottom:24px;}
.plansv2-btn-outline{flex:1;border:1px solid var(--m-plan-c-easy);border-radius:var(--m-r-pill);padding:12px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform var(--m-dur-press-out) var(--m-ease);}
.plansv2-btn-outline .ph{width:24px;height:24px;color:var(--m-plan-c-easy);}
.plansv2-btn-fill{flex:1;border:none;border-radius:var(--m-r-pill);padding:12px;background:var(--m-plan-c-easy);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform var(--m-dur-press-out) var(--m-ease);}
.plansv2-btn-fill .ph{width:24px;height:24px;color:#fff;}
.plansv2-btn-outline:active,.plansv2-btn-fill:active{transform:scale(.95);}
.plansv2-section-label{margin:0 2px 12px;}
.plansv2-list{display:flex;flex-direction:column;gap:4px;margin-bottom:24px;}
.plansv2-list:last-of-type{margin-bottom:0;}
/* Swipe-to-delete / swipe-to-share (every plan, see attachPlanSwipeV2()):
   .plansv2-card-wrap clips and hosts two full-bleed action layers behind
   the card itself — red delete (revealed sliding left) and yellow share
   (revealed sliding right) — which JS slides via transform:translateX.
   Both layers sit at inset:0 (so the revealed color always fills clean
   edge-to-edge, not just a same-width sliver); only one is opacity:1 at
   a time, toggled by attachPlanSwipeV2() from the live drag direction. */
.plansv2-card-wrap{position:relative;overflow:hidden;border-radius:var(--m-r-md);touch-action:pan-y;}
.plansv2-card-delete{position:absolute;inset:0;border-radius:var(--m-r-md);background:#f00;display:flex;align-items:center;justify-content:flex-end;padding-right:28px;color:#fff;cursor:pointer;opacity:0;pointer-events:none;}
.plansv2-card-delete .ph{width:32px;height:32px;transition:transform var(--m-dur-quick) ease;}
/* Past the full-swipe threshold: bump the icon so it's obvious that
   releasing now deletes, rather than just snapping open to the reveal. */
.plansv2-card-wrap.plansv2-will-delete .plansv2-card-delete .ph{transform:scale(1.35);}
.plansv2-card-share{position:absolute;inset:0;border-radius:var(--m-r-md);background:#f5b942;display:flex;align-items:center;justify-content:flex-start;padding-left:28px;color:#2c2727;cursor:pointer;opacity:0;pointer-events:none;}
.plansv2-card-share .ph{width:32px;height:32px;transition:transform var(--m-dur-quick) ease;}
.plansv2-card-wrap.plansv2-will-share .plansv2-card-share .ph{transform:scale(1.35);}
.plansv2-card{border-radius:var(--m-r-md);padding:16px;display:flex;align-items:center;width:100%;box-sizing:border-box;border:none;cursor:pointer;font-family:inherit;text-align:left;position:relative;transition:transform var(--m-dur-press-out) var(--m-ease);touch-action:pan-y;}
.plansv2-card:active{transform:scale(.98);}
.plansv2-card-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
.plansv2-card-name{margin:0;font-size:var(--m-fs-md);font-weight:500;line-height:1.1;letter-spacing:.64px;text-transform:uppercase;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.plansv2-card-stats{display:flex;gap:16px;flex-wrap:wrap;}
.plansv2-stat{display:flex;align-items:center;gap:4px;}
.plansv2-stat .ph{width:16px;height:16px;color:#fff;flex-shrink:0;}
.plansv2-stat span{font-size:var(--m-fs-2xs);color:#fff;white-space:nowrap;}
.plansv2-card-actions{display:flex;align-items:center;gap:12px;flex-shrink:0;margin-left:12px;}
/* plan-star-on's checkmark uses currentColor (2026-08-29 — Maciej
   pointed out the checkmark stayed navy blue even on a red/orange
   "Twoje plany" card) so buildPlanCardV2() can set it inline to match
   that specific card's own background color; the white circle behind
   it and plan-star-off's white ring/checkmark are unaffected, still
   baked into the SVG. */
.plansv2-card-star{cursor:pointer;flex-shrink:0;display:flex;}
.plansv2-card-star .ph{width:20px;height:20px;}
.plansv2-card-customize{cursor:pointer;flex-shrink:0;display:flex;}
.plansv2-card-customize .ph{width:24px;height:24px;color:#fff;}
.plansv2-hidden{display:none;}
/* "Dostosuj plan" / "Dodaj ćwiczenie" / "Wybierz ćwiczenie" / "Opinia" v2
   — stage 2 of the sheet refactor: this family now rides the shared
   .m-sheet bottom sheet (see the .m-sheet block above) instead of a
   centered card. The three class names stay so all four open/close
   functions keep working; only the geometry + motion change here.
   .plansv2-customize-stack is the moving panel (== .m-sheet),
   .plansv2-customize-card is its scrolling body. */
.plansv2-customize-overlay{flex-direction:column;align-items:stretch;justify-content:flex-end;padding:0;overflow:hidden;gap:0;background:rgba(52,57,65,.88);-webkit-backdrop-filter:blur(4.85px);backdrop-filter:blur(4.85px);}
.plansv2-customize-stack{width:calc(100% - 20px);max-width:500px;margin:0 auto var(--m-sheet-gap);background:var(--m-panel);border-radius:34px 34px var(--m-sheet-r-bottom) var(--m-sheet-r-bottom);padding:0 0 max(14px, calc(env(safe-area-inset-bottom) - var(--m-sheet-gap)));box-sizing:border-box;max-height:calc(100% - var(--m-sheet-top) - var(--m-sheet-gap));display:flex;flex-direction:column;align-items:center;overflow:hidden;font-family:var(--m-font);will-change:transform;}
.plansv2-customize-overlay.m-kb .plansv2-customize-stack{padding-bottom:14px;margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;}
.plansv2-customize-stack.m-sheet-snapback{transition:transform var(--m-dur-snap) var(--m-ease-sheet);}
@media (prefers-reduced-motion: no-preference){
  .plansv2-customize-overlay{animation:mSheetBackdropIn var(--m-dur-fade) ease-out;}
  .plansv2-customize-overlay.plansv2-customize-closing{animation:mSheetBackdropOut var(--m-dur-fade) ease-in forwards;}
  .plansv2-customize-overlay:not(.m-sheet-entered) .plansv2-customize-stack{animation:mSheetUp var(--m-dur-in) var(--m-ease-sheet);}
  .plansv2-customize-overlay.plansv2-customize-closing .plansv2-customize-stack{animation:mSheetDown var(--m-dur-exit) var(--m-ease-exit) forwards;}
}
.plansv2-customize-card{flex:1;min-height:0;display:flex;flex-direction:column;gap:20px;background:transparent;border-radius:0;padding:4px 16px 4px;width:100%;box-sizing:border-box;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;}
/* picker: the "DODAJ" button is now a pinned sibling of the card inside
   the sheet (moved into .plansv2-customize-stack in the markup), so the
   card just fills the remaining sheet height like the others. */
#pickExerciseOverlayV2 .plansv2-customize-card{max-height:none;}
#pickExerciseOverlayV2 .newex-v2-add-fab{margin:14px 0 0;}
/* Rebuilt to match Figma node 153:701 (2026-08-29) — app-level
   topbar (barbell + PLANS + X, same pattern as .plansv2-header on the
   real Plans v2 screen, just sized for the narrower modal) instead of
   the previous "DOSTOSUJ PLAN" pill; the plan being edited now gets
   its own hero card below instead. */
.plansv2-customize-topbar{display:flex;align-items:center;justify-content:space-between;}
.plansv2-customize-topbar-title{display:flex;align-items:center;gap:10px;}
.plansv2-customize-topbar-title .ph{width:40px;height:40px;color:var(--m-orange);}
.plansv2-customize-topbar-title h1{margin:0;font-size:var(--m-fs-2xl);font-weight:400;color:var(--m-ink);letter-spacing:-.02em;}
.plansv2-customize-close{width:24px;height:24px;flex-shrink:0;color:var(--m-ink);cursor:pointer;}
.plansv2-customize-close.ph{display:block;}
.plansv2-customize-close svg{display:block;width:100%;height:100%;}
/* The raw PH icon strings carry their own width/height HTML attributes
   (e.g. plus-icon is 50x50), which size the <svg> itself regardless of
   its wrapping .ph span's CSS size unless something forces it to fill
   that span — every other v3 root scope has its own "<root> .ph
   svg{width:100%;height:100%}" rule for exactly this (see .plansv2-root
   .ph svg etc.), but .plansv2-customize-stack lives outside any of
   those roots (it's a top-level overlay, not nested in a .view), so it
   never got one — left the topbar's title icon rendering at its native
   50x50 inside a 40x40 box, overlapping the title text next to it
   (Maciej, 2026-09-01: "Plus i napisz Ćwiczenia - się rozjechał").
   One rule here covers every icon in both this modal and "Dodaj własne
   ćwiczenie" v2, which shares this same .plansv2-customize-stack shell. */
.plansv2-customize-stack .ph svg{display:block;width:100%;height:100%;}
/* Hero card's background is a live preview of the difficulty-based
   color the plan card will actually end up with once "Zastosuj" runs
   (always the custom/red palette — Dostosuj always forks or updates a
   fork, see applyPlanCustomizeV2()), recomputed on every difficulty
   slider move by updatePlanCustomizeSliderVisual(). */
.plansv2-customize-hero{background:var(--m-plan-mid);border-radius:var(--m-r-sm);padding:18px;box-shadow:0 8px 12px rgba(38,66,164,.11);display:flex;flex-direction:column;gap:8px;transition:background var(--m-dur-quick) ease;}
.plansv2-customize-hero-eyebrow{margin:0;}
.plansv2-customize-hero-name{margin:0;font-size:var(--m-fs-2xl);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-transform:uppercase;color:#fff;}
.plansv2-customize-options{display:flex;flex-direction:column;gap:16px;}
.plansv2-customize-section{display:flex;flex-direction:column;gap:8px;}
/* 14px/0.56px kerning/#2c2727, no bold — matches .plansv2-section-label
   on the real Plans v2 screen and the fresh type pass in the "06. PLAN
   - SET UP" Figma file (node 155:1086); this modal had drifted to an
   older, smaller 12px/600/1.2px token before that unification. */
.plansv2-customize-label{margin:0;}
/* Trudność/Dni w tygodniu get their own boxed card in the Figma design
   — visually groups the slider + its supporting text apart from the
   flat chip sections. */
.plansv2-customize-boxed{background:var(--m-card);border-radius:var(--m-r-sm);padding:14px;display:flex;flex-direction:column;gap:10px;}
.plansv2-customize-boxed.hidden{display:none;}
.plansv2-customize-dni-header{display:flex;align-items:center;justify-content:space-between;}
.plansv2-customize-dni-value{margin:0;font-size:var(--m-fs-sm);font-weight:700;color:var(--m-orange);}
.plansv2-customize-divider{height:1px;background:rgba(0,0,0,.08);width:100%;}
.plansv2-choice-row{display:flex;gap:7px;flex-wrap:wrap;}
.plansv2-choice-chip{border:1px solid rgba(0,0,0,.05);border-radius:var(--m-r-sm);padding:11px 10px;background:var(--m-card);font-size:var(--m-fs-xs);font-weight:600;color:var(--m-ink);font-family:inherit;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease);flex:1;text-align:center;}
.plansv2-choice-chip:active{transform:scale(.95);}
.plansv2-choice-chip.active{background:var(--m-orange);border-color:var(--m-orange);color:#fff;}
/* Trudność/Dni w tygodniu are genuine ordered scales — a slider reads
   correctly there. Cel treningowy/Sprzęt stay chips on purpose: three
   unordered categories on a slider would falsely imply they sit along
   one continuous line. Maciej, 2026-08-29. Native <input type=range>
   rather than a hand-rolled drag component — touch dragging on a real
   range input is solid on iOS Safari for free, unlike custom touch-
   gesture code (see the swipe-to-delete saga earlier this build). No
   filled/progress portion on the track (Figma's own slider doesn't
   have one either, just a flat track + the thumb sitting at the
   value) — the active tick label is what communicates the value. */
.plansv2-slider-wrap{padding:2px 4px 0;}
.plansv2-slider-input{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:var(--m-r-pill);background:#c7c6cb;outline:none;margin:0;display:block;}
.plansv2-slider-input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--m-orange);box-shadow:0 1px 4px rgba(44,39,39,.25);cursor:pointer;}
.plansv2-slider-input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--m-orange);box-shadow:0 1px 4px rgba(44,39,39,.25);cursor:pointer;}
.plansv2-slider-input::-moz-range-track{height:6px;border-radius:var(--m-r-pill);background:#c7c6cb;}
.plansv2-slider-ticks{display:flex;justify-content:space-between;margin-top:10px;}
.plansv2-slider-ticks span{font-size:var(--m-fs-2xs);font-weight:500;color:var(--m-muted);transition:color var(--m-dur-quick) ease;}
.plansv2-slider-ticks span.active{color:var(--m-orange);font-weight:700;}
.plansv2-customize-freq-hint{margin:0;font-size:var(--m-fs-xs);line-height:1.5;color:#2c2727;}
.plansv2-customize-actions{display:flex;gap:10px;}
.plansv2-customize-cancel{flex:1;border:1px solid var(--m-plan-c-easy);border-radius:var(--m-r-pill);padding:12px;background:none;font-size:var(--m-fs-base);font-weight:600;color:var(--m-ink);font-family:inherit;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease);}
.plansv2-customize-apply{flex:1;border:none;border-radius:var(--m-r-pill);padding:12px;background:var(--m-plan-c-easy);font-size:var(--m-fs-base);font-weight:600;color:#fff;font-family:inherit;cursor:pointer;transition:transform var(--m-dur-press-out) var(--m-ease);}
.plansv2-customize-apply:disabled{opacity:.4;cursor:not-allowed;}
.plansv2-customize-cancel:active,.plansv2-customize-apply:active{transform:scale(.97);}

/* "Dodaj własne ćwiczenie" v2 (#newExerciseOverlayV2, Figma node
   171:3546, Maciej's own design — 2026-09-01) — sits inside the exact
   same .plansv2-customize-* shell as "Dostosuj plan" above; this is
   the handful of pieces unique to this form. */
.newex-v2-topbar{display:flex;align-items:center;justify-content:space-between;}
.newex-v2-topbar-title{display:flex;align-items:center;gap:11px;}
.newex-v2-topbar-title .ph{width:40px;height:40px;color:var(--m-orange);}
.newex-v2-topbar-title h1{margin:0;font-size:var(--m-fs-lg);font-weight:400;color:var(--m-ink);letter-spacing:.04em;}
/* Unified to 24px to match .plansv2-customize-close/.exv2-close
   (Maciej, 2026-09-03: picked 24px everywhere over 40px when asked
   about the split found during the v3 consistency pass). */
.newex-v2-close{width:24px;height:24px;flex-shrink:0;color:var(--m-ink);cursor:pointer;}
.newex-v2-close svg{display:block;width:100%;height:100%;}
/* Maciej, 2026-09-01: "Napisy zrob prosze wszystko duzymi literami" —
   matches Figma's own example content ("FULLBODY WORKOUT" in the name
   field). text-transform is purely visual, doesn't touch the actual
   typed/stored value's case. */
.newex-v2-field-input{width:100%;box-sizing:border-box;background:var(--m-card);border:1px solid #c7c6cb;border-radius:var(--m-r-sm);padding:11px 20px;font-size:var(--m-fs-base);font-weight:500;letter-spacing:.04em;color:var(--m-ink);font-family:inherit;text-transform:uppercase;}
.newex-v2-field-input::placeholder{color:var(--m-muted);font-weight:500;text-transform:none;}
.newex-v2-select-wrap{position:relative;}
.newex-v2-select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:48px;}
.newex-v2-select-caret{position:absolute;top:50%;right:16px;transform:translateY(-50%);width:24px;height:24px;color:var(--m-ink);pointer-events:none;}
/* Pure white (not the var(--m-card) every other card uses) — matches Figma's
   own "bento-series-container" treatment for this one card. */
.newex-v2-bento{width:100%;box-sizing:border-box;background:#fff;border-radius:var(--m-r-md);padding:10px 16px;display:flex;flex-direction:column;gap:12px;}
.newex-v2-bento-row{display:flex;align-items:center;justify-content:space-between;}
.newex-v2-bento-label{margin:0;font-size:var(--m-fs-2xs);font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--m-muted);}
.newex-v2-bento-value{width:86px;height:37px;box-sizing:border-box;background:#fff;border:1px solid #c7c6cb;border-radius:8px;text-align:center;font-size:var(--m-fs-md);font-weight:500;color:var(--m-ink);font-family:inherit;-moz-appearance:textfield;}
/* Maciej, 2026-09-01: "nie chce miec tych strzalek przy cyfrach" — hide
   the native number-input spinner. */
.newex-v2-bento-value::-webkit-outer-spin-button,
.newex-v2-bento-value::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
/* #pickExerciseAddBtnV2 ("DODAJ (N)" in the exercise picker) sits
   outside the lilac card entirely, on the dark backdrop — matches the
   app's established "primary action floats free of the card" pattern
   (.pev2-save-fab/"ZAPISZ PLAN", .gymv2-save/"ZAPISZ TRENING") instead
   of sitting inside .plansv2-customize-actions (Maciej, 2026-09-02:
   "guzik dodaj powinien być poza szarym tłem tak jak mamy to też na
   innych ekranach" — build 101 first applied this to the wrong popup,
   "Dodaj własne ćwiczenie", which Maciej confirmed was already fine
   as designed; this is scoped to the picker's confirm button only).
   Originally position:fixed pinned to the viewport bottom — on a tall
   (fully-expanded, many-group) picker the card's own max-height could
   still reach into that fixed zone, overlapping the button instead of
   leaving a gap (Maciej, real device: "guzik dodaj powinien być
   całkiem poza tym boxem szarym między nim a guzikiem w projekcie
   jest 24px"). Now a normal-flow sibling of .plansv2-customize-stack
   inside the overlay's own flex column, spaced by the overlay's own
   gap:24px — matching the Figma spec's 24px exactly, and guaranteed
   never to overlap the card since it's no longer independently
   positioned against the viewport. Same width/sizing as
   .pev2-save-fab. */
.newex-v2-add-fab{width:100%;max-width:217px;background:#fff;border:none;border-radius:var(--m-r-pill);padding:14px;font-size:var(--m-fs-md);font-weight:500;letter-spacing:.64px;color:var(--m-ink);cursor:pointer;font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.12);transition:transform var(--m-dur-press-out) var(--m-ease);flex-shrink:0;}
.newex-v2-add-fab:active{transform:scale(.97);}

/* "Podziel się opinią" v2 (#feedbackOverlayV2, Figma node 175:9818) —
   sits inside the exact same .plansv2-customize-* shell as the other
   popups; unlike them this header has no icon next to the title (just
   title + close, per Figma), so it gets its own small header classes
   instead of reusing .newex-v2-topbar/.plansv2-customize-topbar. Type
   chips reuse .plansv2-choice-row/.plansv2-choice-chip verbatim (same
   border/radius/active-state as "Cel treningowy" in Dostosuj plan),
   and the action row reuses .plansv2-customize-actions/-cancel/-apply
   verbatim — only the textarea is genuinely new. Replaces openFeedback()
   only on the v2 preview screens (Dashboard/GYM v2/Plans v2 list+editor);
   the Welcome screen's own feedback button stays on the untouched
   production popup, same old/v2 split as everywhere else this session. */
.fbv2-header{display:flex;flex-direction:column;gap:4px;width:100%;}
.fbv2-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;width:100%;}
.fbv2-title-row h1{margin:0;font-size:var(--m-fs-lg);font-weight:400;color:#2c2727;letter-spacing:.04em;text-transform:uppercase;}
.fbv2-subtitle{margin:0;font-size:var(--m-fs-xs);line-height:1.5;color:#2c2727;}
.fbv2-textarea{display:block;width:100%;box-sizing:border-box;background:var(--m-card);border:1px solid #c7c6cb;border-radius:var(--m-r-sm);padding:12px 20px;font-size:var(--m-fs-base);font-weight:500;color:var(--m-ink);font-family:inherit;height:201px;resize:vertical;}
.fbv2-textarea--sm{height:90px;}
.fbv2-textarea::placeholder{color:var(--m-muted);opacity:1;}

/* ===================== PLAN EDITOR v2 (Figma node 155:1086,
   "06. PLAN - SET UP") — the v3-styled replacement for #view-planEditor.
   Reuses editingPlan/togglePlanExercise/day-select-mode/PLAN_EX_GROUPS/
   muscleGroupBucket/buildAddCustomExerciseTile wholesale (see
   openPlanEditorV2() and friends near savePlanEditor()); this block is
   purely the new visual skin. Shares Plans v2's scroll-lock mechanics
   (.plansv2-lock, see goRoute()) but NOT its flat lilac background —
   per Figma (node 155:1087/bg-[var(--m-red-page)]) the page itself is red, with
   the lilac card wrapping just the real content and ending in rounded
   bottom corners partway down, so the floating "ZAPISZ PLAN" button
   and the bottom nav sit on bare red below it (Maciej, 2026-08-31:
   "kończy się szare jest czerwona apla na której finalnie znajdzie się
   button"). */
body.pev2-bg{background:var(--m-panel);}
/* Reserved red gap below the card, for the fixed "ZAPISZ PLAN" button
   to float on without overlapping the card's own last row at full
   scroll. Went 190px (build 82) -> 140px (build 83, still "za duża
   przestrzeń") -> 70px (build 86, Maciej: "nadal duża" even at 140) —
   at 70px the button (bottom:118px) still clears the card by ~14px at
   full scroll (measured live, not just estimated from the button's own
   box). If this needs to go lower still, the button's own `bottom`
   offset is the next lever, not just this margin. */
.pev2-card{background:var(--m-panel);border-radius:0 0 26px 26px;overflow:hidden;margin-bottom:70px;}
.pev2-panel{padding-bottom:28px;}
.pev2-body{display:flex;flex-direction:column;gap:24px;}
.pev2-name-input{width:100%;box-sizing:border-box;background:var(--m-card);border:1px solid rgba(0,0,0,.05);border-radius:var(--m-r-sm);padding:11px 20px;font-size:var(--m-fs-base);font-weight:500;color:var(--m-ink);font-family:inherit;}
.pev2-name-input::placeholder{color:var(--m-muted);font-weight:500;}
.pev2-fork-hint{margin:8px 2px 0;font-size:var(--m-fs-xs);line-height:1.5;color:#2c2727;}
.pev2-periodize-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:10px;background:var(--m-card);border:1px solid rgba(0,0,0,.05);border-radius:var(--m-r-sm);padding:12px 14px;font-family:inherit;cursor:pointer;text-align:left;}
.pev2-periodize-toggle-title{display:block;font-size:var(--m-fs-xs);font-weight:600;color:var(--m-ink);}
.pev2-periodize-toggle-desc{display:block;margin-top:2px;font-size:var(--m-fs-2xs);color:var(--m-muted);line-height:1.35;}
.pev2-periodize-toggle-switch{flex:none;width:40px;height:24px;border-radius:var(--m-r-pill);background:rgba(0,0,0,.12);position:relative;transition:background var(--m-dur-quick) ease;}
.pev2-periodize-toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform var(--m-dur-quick) ease;}
.pev2-periodize-toggle-switch.active{background:var(--m-orange);}
.pev2-periodize-toggle-switch.active::after{transform:translateX(16px);}
.pev2-fork-hint.hidden{display:none;}
.pev2-day-row{display:flex;gap:4px;}
.pev2-day-chip{position:relative;flex:1;min-width:0;text-align:center;background:var(--m-card);border:1px solid rgba(0,0,0,.05);border-radius:var(--m-r-sm);padding:11px 0 15px;font-size:var(--m-fs-xs);font-weight:500;color:var(--m-ink);cursor:pointer;font-family:inherit;transition:transform var(--m-dur-press-out) var(--m-ease);}
.pev2-day-chip:active{transform:scale(.95);}
.pev2-day-chip.active{background:var(--m-orange);border-color:var(--m-orange);color:#fff;}
.pev2-day-chip.has-ex::after{content:'';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--m-orange);}
.pev2-day-chip.active.has-ex::after{background:#fff;}
.pev2-day-chip.picked{box-shadow:inset 0 0 0 2px #2c2727;}
/* Maciej, 2026-08-31: "wystarczy sama czarna ramka bez tego znaku
   ptaszka" — the ring alone is enough, dropped the corner checkmark. */
.pev2-day-hint-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;}
.pev2-day-hint{flex:1;margin:0;font-size:var(--m-fs-2xs);font-weight:500;color:var(--m-muted);}
.pev2-select-mode-btn{flex-shrink:0;border:none;border-radius:var(--m-r-pill);background:var(--m-plan-c-easy);color:#fff;padding:6px 20px;font-size:var(--m-fs-xs);font-weight:500;letter-spacing:.48px;cursor:pointer;font-family:inherit;}
.pev2-select-mode-btn.hidden{display:none;}
/* Contained as one card, not loose floating pieces — before any day is
   picked, count/copy/clear are all empty/hidden and only the exit X is
   left, which read as a stray, orphaned icon with nothing around it
   (Maciej, 2026-08-31: "coś dziwnie działa i wyświetla się ta opcja").
   The card boundary keeps it reading as one intentional toolbar in
   every state. */
.pev2-select-bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;background:var(--m-card);border:1px solid rgba(0,0,0,.05);border-radius:var(--m-r-sm);padding:10px 14px;}
.pev2-select-bar.hidden{display:none;}
.pev2-select-count{font-size:var(--m-fs-2xs);color:#5b5555;font-weight:600;margin-right:auto;}
.pev2-select-action{border:1px solid var(--m-orange);border-radius:var(--m-r-pill);padding:7px 14px;background:none;color:var(--m-orange);font-size:var(--m-fs-xs);font-weight:700;cursor:pointer;font-family:inherit;}
.pev2-select-action.hidden{display:none;}
.pev2-select-action.danger{border-color:#c00;color:#c00;}
.pev2-select-exit{border:none;background:none;color:#5b5555;font-size:var(--m-fs-base);cursor:pointer;padding:4px 6px;line-height:1;font-family:inherit;}
/* Equipment-filter icon row (exercise picker / plan editor / swap sheet).
   Tried a bottom-nav-style sliding blob here first — Maciej felt the
   whole concept didn't fit this smaller, denser row. Settled on the
   simplest thing: each chip just fades its own background/icon color
   on .active, no shared moving element. */
.equip-row{display:flex;gap:8px;}
.equip-chip{flex:0 1 52px;min-width:0;aspect-ratio:1;border-radius:50%;background:var(--m-card);border:1px solid rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;font-family:inherit;transition:transform var(--m-dur-press-out) var(--m-ease),background-color var(--m-dur-fade) var(--m-ease),border-color var(--m-dur-fade) var(--m-ease);}
.equip-chip:active{transform:scale(.93);}
.equip-chip .ic{width:26px;height:26px;display:block;}
.equip-chip .ic path,.equip-chip .ic circle,.equip-chip .ic rect{fill:var(--m-orange);transition:fill var(--m-dur-fade) var(--m-ease);}
.equip-chip .ic.icon-stroke path{fill:none;stroke:var(--m-orange);transition:stroke var(--m-dur-fade) var(--m-ease);}
.equip-chip.active{background:var(--m-orange);border-color:var(--m-orange);}
.equip-chip.active .ic path,.equip-chip.active .ic circle,.equip-chip.active .ic rect{fill:#fff;}
.equip-chip.active .ic.icon-stroke path{stroke:#fff !important;}
.pev2-groups{display:flex;flex-direction:column;gap:8px;}
.pev2-section{border:1px solid #c7c6cb;border-radius:var(--m-r-sm);padding:10px;display:flex;flex-direction:column;gap:12px;}
/* Collapsed section = plain white pill, no border (Figma node
   160:2855, the "NOGI" section shown collapsed — border-less there,
   unlike the bordered expanded card). Maciej, 2026-08-31: "belka ze
   zwinięta partią mięśni bez stroke". */
.pev2-section.collapsed{background:#fff;border-color:transparent;}
.pev2-section-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.pev2-section-heading{display:flex;align-items:center;gap:8px;}
.pev2-section-num{background:var(--m-plan-c-easy);border-radius:6px;padding:4px 8px;color:#fff;}
.pev2-section-header .ph{width:24px;height:24px;color:var(--m-ink);transition:transform var(--m-dur-fade) ease;flex-shrink:0;}
.pev2-section-header .ph.collapsed{transform:rotate(-90deg);}
.pev2-save-fab{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);width:calc(100% - 40px);max-width:217px;background:var(--m-orange);border:none;border-radius:var(--m-r-pill);padding:14px;font-size:var(--m-fs-md);font-weight:500;letter-spacing:.64px;color:#fff;cursor:pointer;font-family:inherit;transition:transform var(--m-dur-press-out) var(--m-ease);z-index:15;}
.pev2-save-fab:active{transform:translateX(-50%) scale(.97);}

/* Entrance motion — same idiom as GYM v2/Dashboard: header fades/rises

   animacje do tego ekranu zgodnie z animacją na innych ekranach") —
   header/chat-btn already inherit dashRise for free from
   .plansv2-header/.plansv2-chat-btn above (same classes, reused
   verbatim). The three static fields (name/days/equipment) rise in as
   their own staggered tiles, then each muscle-group section cascades
   in — gated behind .pev2-anim-in (added only by openPlanEditorV2()'s
   renderPlanEditorGridV2(true) on a real screen visit — see

   equipment filter, or toggling an exercise mid-session doesn't replay

/* GYM v2 set-logging popup (node 112:1872) — separate from .ex-popup-box/.set-row
   above, which stay exactly as they are for production GYM.
   Consistency pass (2026-09-03, "sprawdz v2 pod wzgledem spojnosci"):
   this popup predates the .plansv2-customize-* family and had drifted
   from it on two points, brought back in line here —
   - padding was still the base .onboard-overlay 20px (10px on the
     other three popups since build 99/100's real-device fix), and
     max-width was still 355px (tuned for an exact 375px viewport,
     same stale assumption the other three had until build 100) —
     both would reproduce the exact "sides bigger than 10px on a wider
     real phone" bug already fixed everywhere else.
   - its entrance/exit animation was unconditional, not gated behind
     prefers-reduced-motion like every other popup in this family (and
     like [[feedback_thryve_animation_vocabulary]] calls for app-wide). */
/* ============================================================
   .m-sheet — shared iOS-style bottom sheet: pinned to the bottom
   edge, full width, rounded top only, grabber, springs up from
   translateY(100%). Stage 1 host: the set-logging popup (below).
   Stage 2 folds the whole .plansv2-customize-* family onto this.
   Simplified drag-to-dismiss is wired in JS (mSheetDrag): drag the
   grabber down, release past ~40% or on a downward flick to close,
   otherwise snap back — inner scroll is left alone. Reuses the app's
   established slide-up curve (var(--m-ease-sheet)) rather than
   a new one, per [[feedback_thryve_animation_vocabulary]]. */
.m-sheet-overlay{flex-direction:column;align-items:stretch;justify-content:flex-end;padding:0;overflow:hidden;background:rgba(52,57,65,.88);-webkit-backdrop-filter:blur(4.85px);backdrop-filter:blur(4.85px);}
.m-sheet{width:calc(100% - 20px);max-width:500px;margin:0 auto var(--m-sheet-gap);background:var(--m-panel);border-radius:34px 34px var(--m-sheet-r-bottom) var(--m-sheet-r-bottom);padding:0 0 max(14px, calc(env(safe-area-inset-bottom) - var(--m-sheet-gap)));box-sizing:border-box;max-height:calc(100% - var(--m-sheet-top) - var(--m-sheet-gap));position:relative;display:flex;flex-direction:column;overflow:hidden;font-family:var(--m-font);will-change:transform;}
/* % = of the overlay's content box, which syncSheetsToVisualViewport() pads
   down to the visible band — so the sheet always fits above the keyboard.
   With the keyboard up, the home-indicator inset is under it: drop it. */
.m-sheet-overlay.m-kb .m-sheet{padding-bottom:14px;margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;}
.m-sheet-grab{flex-shrink:0;width:40px;height:5px;border-radius:3px;background:rgba(44,39,39,.22);margin:8px auto 10px;cursor:grab;touch-action:none;}
.m-sheet-grab:active{cursor:grabbing;}
.m-sheet-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:24px;overflow:hidden;}
/* Exercise-logging popup only (Figma node 305:582, 2026-09-15) — Maciej's
   redesign: sheet rides much higher (~30px from the top, not the shared
   .m-sheet's 92%). Scoped to THIS popup's ids only, not the shared
   .m-sheet/.m-sheet-body classes — swapExerciseSheetV2 and everything
   else stay as they were until Maciej confirms this look and asks to
   roll it out everywhere. */
#exercisePopupSheetV2{max-height:calc(100% - 30px);}
/* Maciej (2026-09-15, live iteration on the above): the submit button
   sitting outside/below .exv2-card's own scroll as a sticky footer could
   still read as covering content near the bottom on some layouts — moved
   it to be the last item INSIDE .exv2-card (plain scroll flow, nothing
   can ever sit on top of it) instead. .exv2-card's own 24px gap + this
   16px margin = the 40px spacing he asked for before the button. */
.exv2-card .exv2-submit{margin-top:16px;align-self:center;}
.m-sheet-snapback{transition:transform var(--m-dur-snap) var(--m-ease-sheet);}
@media (prefers-reduced-motion: no-preference){
  .m-sheet-overlay{animation:mSheetBackdropIn var(--m-dur-fade) ease-out;}
  .m-sheet-overlay.m-sheet-closing{animation:mSheetBackdropOut var(--m-dur-fade) ease-in forwards;}
  .m-sheet-overlay:not(.m-sheet-entered) .m-sheet{animation:mSheetUp var(--m-dur-in) var(--m-ease-sheet);}
  .m-sheet-overlay.m-sheet-closing .m-sheet{animation:mSheetDown var(--m-dur-exit) var(--m-ease-exit) forwards;}
  @keyframes mSheetBackdropIn{from{opacity:0;}to{opacity:1;}}
  @keyframes mSheetBackdropOut{from{opacity:1;}to{opacity:0;}}
  @keyframes mSheetUp{from{transform:translateY(calc(100% + var(--m-sheet-gap)));}to{transform:translateY(0);}}
  @keyframes mSheetDown{from{transform:translateY(0);}to{transform:translateY(calc(100% + var(--m-sheet-gap)));}}
}
/* set-logging card: the sheet owns the panel bg + rounded top; the card
   keeps its own internal scroll so the submit button below stays pinned
   to the sheet's bottom edge (flex sibling, flex-shrink:0). */
.exv2-card{flex:1;min-height:0;display:flex;flex-direction:column;gap:24px;background:transparent;border-radius:0;padding:7px 18px 4px;width:100%;box-sizing:border-box;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;}

.exv2-pill span{font-size:var(--m-fs-2xs);font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:#0e267b;white-space:nowrap;}
/* Periodized plans only — which execution version (Max/Objętość/Siła/
   Gęstość) today's set of this exercise is, next to the muscle-group pill. */
.exv2-pill--version{background:var(--m-orange);}
.exv2-pill--version span{color:#fff;}
.exv2-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;width:100%;}
.exv2-title{font-size:var(--m-fs-xl);font-weight:400;letter-spacing:.88px;text-transform:uppercase;color:#2c2727;line-height:1.15;}
.exv2-close{width:24px;height:24px;flex-shrink:0;color:#2c2727;cursor:pointer;}
.exv2-close svg{display:block;width:100%;height:100%;}
.exv2-stats{display:flex;gap:16px;flex-wrap:wrap;}
.exv2-stat{display:flex;align-items:center;gap:12px;}
.exv2-stat .ph{width:16px;height:16px;display:block;flex-shrink:0;color:var(--m-plan-c-easy);}
.exv2-stat .ph svg{display:block;width:100%;height:100%;}
.exv2-stat span{font-size:var(--m-fs-base);color:#2c2727;white-space:nowrap;}
.exv2-tip{background:#000;border-radius:var(--m-r-sm);padding:9px 17px;text-align:left;}

.exv2-tip .lbl .ph{width:11px;height:11px;display:inline-block;vertical-align:-1px;margin-right:14px;}
.exv2-tip--ai .lbl{color:#DE74FF;}

/* #6 — sticky per-exercise note */
.exv2-note{background:#e7ecff;border-radius:var(--m-r-sm);padding:10px 14px;display:flex;align-items:flex-start;gap:11px;text-align:left;}
.exv2-note-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.exv2-note-k{font-size:var(--m-fs-2xs);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#2c3fae;}
.exv2-note-v{font-size:var(--m-fs-sm);color:#2c3fae;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;}
.exv2-note-edit{flex-shrink:0;width:18px;height:18px;border:0;background:none;padding:0;cursor:pointer;color:#2c3fae;}
.exv2-note-edit .ph,.exv2-note-edit svg{display:block;width:100%;height:100%;}
.exv2-note.is-edit{flex-direction:column;gap:8px;}
.exv2-note-input{width:100%;box-sizing:border-box;border:1px solid #c2ccf2;border-radius:10px;padding:9px 11px;font-family:inherit;font-size:var(--m-fs-sm);color:var(--m-ink);background:#fff;line-height:1.45;resize:none;}
.exv2-note-actions{display:flex;gap:8px;justify-content:flex-end;width:100%;}

.exv2-note-cancel{background:rgba(44,63,174,.12);color:#2c3fae;}
.exv2-note-save{background:#2c3fae;color:#fff;}
.exv2-note-hint{margin:0;font-size:var(--m-fs-2xs);color:#6f78b8;line-height:1.4;}
.exv2-note-add{display:flex;align-items:center;gap:8px;width:100%;background:none;border:1px dashed #b9c2ef;border-radius:var(--m-r-sm);padding:10px 14px;font-family:inherit;font-size:var(--m-fs-xs);font-weight:600;color:#2c3fae;cursor:pointer;text-align:left;transition:transform var(--m-dur-press-out) var(--m-ease);}

.exv2-note-add:active{transform:scale(.99);}
.exv2-series-section{display:flex;flex-direction:column;gap:16px;}
.exv2-series-list{display:flex;flex-direction:column;gap:4px;}
/* Series-card layout per updated Figma (node 122:4121): "Seria X" moved
   beside the fields instead of stacked above them — one row instead of
   two, bottom-aligned so the label sits level with the input boxes, not
   the tiny field-labels above them. This is the redesign Maciej made
   specifically to kill the popup's scroll problem at 4-5 series. */
.exv2-series-card{background:#fff;border-radius:var(--m-r-md);padding:10px 16px;display:flex;align-items:flex-end;gap:12px;box-sizing:border-box;}
.exv2-series-label{font-size:var(--m-fs-base);letter-spacing:.56px;text-transform:uppercase;color:#2c2727;width:76px;flex-shrink:0;}
.exv2-series-fields{display:flex;gap:12px;flex:1;min-width:0;}
.exv2-field{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.exv2-field label{font-size:var(--m-fs-2xs);font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--m-muted);}
.exv2-field input{background:#fff;border:1px solid #c7c6cb;border-radius:var(--m-r-sm);padding:8px 12px;font-size:var(--m-fs-md);font-weight:500;color:var(--m-ink);font-family:inherit;width:100%;box-sizing:border-box;}
/* the placeholder is last session's numbers — a hint, so a filled
   field (your real value) stands out from one you haven't touched yet.
   Solid #71747A per Figma node 305:582 (2026-09-15) — was --m-ink @ .42. */
.exv2-field input::placeholder{color:#71747A;opacity:1;}
/* right-side tick: solid green disc + white check, appears once both

.exv2-series-tick svg{display:block;width:100%;height:100%;}
.exv2-series-card.is-done .exv2-series-tick{opacity:1;transform:scale(1);}
.exv2-series-controls{display:flex;gap:10px;width:100%;}
.exv2-btn-outline{flex:1;border:1px solid var(--m-plan-c-easy);border-radius:var(--m-r-pill);padding:12px;background:none;font-size:var(--m-fs-base);font-weight:500;color:var(--m-ink);font-family:inherit;cursor:pointer;text-align:center;}
.exv2-btn-outline:disabled{opacity:.4;cursor:default;}
.exv2-btn-fill{flex:1;border:none;border-radius:var(--m-r-pill);padding:12px;background:var(--m-plan-c-easy);font-size:var(--m-fs-base);font-weight:500;color:#fff;font-family:inherit;cursor:pointer;text-align:center;}
.exv2-warn{color:var(--m-orange);font-size:var(--m-fs-xs);font-weight:600;line-height:1.4;text-align:center;}
.exv2-submit{border:none;border-radius:var(--m-r-pill);height:49px;width:100%;max-width:275px;background:var(--m-orange);color:#fff;font-size:var(--m-fs-md);font-weight:500;letter-spacing:.64px;font-family:inherit;cursor:pointer;text-align:center;text-transform:uppercase;flex-shrink:0;transition:transform var(--m-dur-press-out) var(--m-ease);}
.exv2-submit:active{transform:scale(.97);}
/* Internal reveal, on top of the popup's own exv2SlideUp entrance — header
   and tip fade/rise in first, then each series card cascades in one after
   another (renderExercisePopupV2(animate) sets the per-card delay inline
   since it depends on how many sets the exercise has), controls/submit
   last. All delays start after the .28s popup slide-up so this doesn't
   fight that motion. Gated behind the .exv2-anim-in modifier class, only
   added when animate=true (a genuine openExercisePopupV2() open) — the
   same box.innerHTML also gets rebuilt on every add/remove-set click
   inside an already-open popup, and replaying the entrance there would
   make already-entered values flash out and back in. */

  @keyframes exv2FadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .exv2-anim-in.exv2-header-group{animation:exv2FadeIn var(--m-dur-in) var(--m-ease) backwards;animation-delay:.28s;}
  .exv2-anim-in.exv2-note,.exv2-anim-in.exv2-note-add{animation:exv2FadeIn var(--m-dur-in) var(--m-ease) backwards;animation-delay:.3s;}
  .exv2-anim-in.exv2-tip{animation:exv2FadeIn var(--m-dur-in) var(--m-ease) backwards;animation-delay:.34s;}
  .exv2-anim-in.exv2-series-controls,.exv2-anim-in.exv2-submit{animation:exv2FadeIn var(--m-dur-in) var(--m-ease) backwards;} /* delay set inline, depends on set count */

  @keyframes exv2CardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .exv2-anim-in.exv2-series-card{animation:exv2CardIn var(--m-dur-in) var(--m-ease) backwards;} /* delay set inline per card */
}

/* ===================== HISTORY v2 (Figma node 177:10060, "10. HISOTRY")

/* Aligned to GYM v2/Plans v2's header exactly (40px icon, 30.654px

/* the whole blue card drags with the finger (see wireHistCalSwipeV2);

.histv2-cal-card{background:var(--m-plan-mid);border-radius:var(--m-r-md);padding:24px 16px 16px;margin-bottom:24px;box-sizing:border-box;touch-action:pan-y;}

.histv2-cal-nav-month .ph:active{opacity:.6;}
.histv2-cal-month-label{font-size:var(--m-fs-xl);font-weight:500;color:#fff;letter-spacing:.88px;text-transform:uppercase;min-width:88px;text-align:center;}
.histv2-cal-nav-year{display:flex;align-items:center;gap:8px;}
.histv2-cal-nav-year .ph{width:16px;height:16px;color:#fff;cursor:pointer;flex-shrink:0;}

.histv2-cal-day{aspect-ratio:1;width:100%;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:var(--m-fs-base);color:#fff;cursor:pointer;border:none;background:none;font-family:inherit;padding:0;}
.histv2-cal-day.outside{color:rgba(255,255,255,.3);cursor:default;}
/* Three plan states (Maciej, Figma 177:10109) — a day is at most one of
   these, checked in this priority: logged beats everything (even an
   off-plan session still counts as done); otherwise a plan day in the
   past is "missed", a plan day today/ahead is "planned"; a non-plan day
   gets no marker at all. See renderCalendarV2(). */
.histv2-cal-day.planned:not(.selected){border:1.5px solid rgba(255,255,255,.75);}
.histv2-cal-day.missed:not(.selected){border:1.5px dashed var(--m-plan-accent);color:var(--m-plan-accent);font-weight:600;}
.histv2-cal-day.has-log:not(.selected){background:var(--m-plan-accent);font-weight:600;}
.histv2-cal-day.selected{background:#fff;color:#2c2727;font-weight:600;}
/* "today" stays the existing white .selected fill — this just adds a ring
   around it (or around a tapped non-today day) when that day is also a
   plan day, so the training-day info doesn't get lost under the white fill. */
.histv2-cal-day.selected.has-ring{outline:1.5px solid #fff;outline-offset:2px;}

.histv2-section-label{margin:0 0 12px;}
/* .histv2-empty — see the shared empty-state rule near .gymv2-no-plan */
.histv2-list{display:flex;flex-direction:column;gap:12px;}
/* position:relative so the card paints ABOVE the swipe reveal layers
   (.plansv2-card-delete / -share, position:absolute, appended before it) —
   without it those opacity:0 layers sit on top and every tap on the card
   hits the share layer instead of expanding. Same reason .plansv2-card
   carries position:relative. */
.histv2-card{background:#fff;border-radius:var(--m-r-md);padding:18px;cursor:pointer;box-sizing:border-box;position:relative;}
.histv2-card.expanded{cursor:default;}
.histv2-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.histv2-card-kind{display:flex;align-items:center;gap:9px;min-width:0;}
.histv2-card-kind .ph{width:30px;height:30px;color:var(--m-orange);flex-shrink:0;}
.histv2-card-kind span{font-size:var(--m-fs-md);color:var(--m-ink);letter-spacing:.65px;}
.histv2-card-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.histv2-card-date{font-size:var(--m-fs-2xs);color:#2c2727;white-space:nowrap;}
.histv2-card-close{width:24px;height:24px;color:#2c2727;cursor:pointer;flex-shrink:0;}
/* collapsed card keeps the plain title / sub line */
.histv2-card-title{margin:20px 0 4px;font-size:var(--m-fs-xl);font-weight:500;color:var(--m-ink);letter-spacing:.88px;text-transform:uppercase;}
.histv2-card-sub{margin:0;font-size:var(--m-fs-base);color:var(--m-muted);letter-spacing:.56px;text-transform:uppercase;}
/* expanded card: "Twój postęp" card + 4-tile session summary + record bar,
   same language as the post-workout finish screen (tiles: time →
   exercises → sets → volume). */
.histv2-wprogress{background:var(--m-plan-mid);border-radius:var(--m-r-sm);padding:13px 15px 14px;color:#fff;margin-top:16px;}
.histv2-wprogress-k{margin:0;display:flex;align-items:center;gap:7px;font-size:var(--m-fs-2xs);font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.82);}
.histv2-wprogress-k .ph{width:13px;height:13px;flex-shrink:0;}
.histv2-wprogress-k .ph svg{display:block;width:100%;height:100%;}
.histv2-wprogress-v{margin:7px 0 0;font-size:var(--m-fs-xl);font-weight:600;letter-spacing:-.02em;line-height:1;}
.histv2-wprogress-ex{margin:6px 0 0;font-size:var(--m-fs-sm);font-weight:500;}
.histv2-wprogress-delta{margin:2px 0 0;font-size:var(--m-fs-2xs);color:rgba(255,255,255,.78);}
.histv2-wprogress + .histv2-wstat{margin-top:8px;}
.histv2-wstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;}
.histv2-wtile{border-radius:var(--m-r-sm);padding:13px 13px 12px;}
.histv2-wtile .k{margin:0 0 5px;font-size:var(--m-fs-2xs);font-weight:500;letter-spacing:.09em;text-transform:uppercase;}
.histv2-wtile .v{margin:0;font-size:26px;font-weight:400;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;}
.histv2-wtile .v small{font-size:var(--m-fs-sm);font-weight:400;margin-left:3px;}
.histv2-wtile--orange{background:var(--m-orange);}
.histv2-wtile--blue{background:var(--m-plan-mid);}
.histv2-wtile--navy{background:var(--m-plan-hard);}
.histv2-wtile--orange,.histv2-wtile--blue,.histv2-wtile--navy{color:#fff;}
.histv2-wtile--orange .k,.histv2-wtile--blue .k,.histv2-wtile--navy .k{color:rgba(255,255,255,.78);}
.histv2-wtile--orange .v small,.histv2-wtile--blue .v small,.histv2-wtile--navy .v small{color:rgba(255,255,255,.72);}
.histv2-wtile--plain{background:var(--m-panel);}
.histv2-wtile--plain .k{color:var(--m-muted);}
.histv2-wtile--plain .v{color:var(--m-ink);}
.histv2-wtile--plain .v small{color:var(--m-muted);}
.histv2-wrecord{display:flex;align-items:center;gap:12px;margin-top:8px;padding:12px 14px;background:var(--m-panel);border-radius:var(--m-r-sm);}
.histv2-wrecord .ph{width:26px;height:26px;color:var(--m-orange);flex-shrink:0;}
.histv2-wrecord-k{margin:0;font-size:var(--m-fs-2xs);font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--m-muted);}
.histv2-wrecord-v{margin:1px 0 0;font-size:var(--m-fs-base);font-weight:500;color:var(--m-ink);}
/* exercise list — now: icon (glyph only) + name + set string */
.histv2-ex-list{display:flex;flex-direction:column;margin-top:18px;}
.histv2-ex-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #edecf1;}
.histv2-ex-item:first-child{border-top:none;padding-top:2px;}
.histv2-ex-ico{width:30px;height:30px;color:var(--m-orange);flex-shrink:0;display:block;}
.histv2-ex-ico svg{display:block;width:100%;height:100%;}
.histv2-ex-ico img{display:block;width:30px;height:30px;object-fit:contain;}
.histv2-ex-meta{min-width:0;}
.histv2-ex-name{margin:0 0 2px;font-size:var(--m-fs-sm);font-weight:500;color:var(--m-ink);}
.histv2-ex-sets{margin:0;font-size:var(--m-fs-2xs);color:var(--m-muted);letter-spacing:.33px;font-variant-numeric:tabular-nums;}
.histv2-run-tiles{display:flex;gap:8px;margin-top:16px;}
.histv2-run-tile{flex:1;background:var(--m-panel);border-radius:var(--m-r-sm);padding:12px 8px;text-align:center;box-sizing:border-box;}
.histv2-run-tile .v{font-size:var(--m-fs-md);font-weight:600;color:var(--m-ink);}
.histv2-run-tile .l{margin-top:4px;font-size:var(--m-fs-2xs);color:var(--m-muted);text-transform:uppercase;letter-spacing:.5px;}
.histv2-run-notes{margin-top:12px;font-size:var(--m-fs-sm);color:var(--m-ink);}

@media (prefers-reduced-motion: no-preference){
  .histv2-cal-card{animation:dashTileRise var(--m-dur-tile) var(--m-ease) backwards;animation-delay:.1s;}
  /* month change (swipe on the calendar, or the ‹ › arrows): the grid
     slides in from the direction you swiped, like the stats carousel */
  @keyframes histCalSlide{from{opacity:.3;transform:translateX(var(--sd,0));}to{opacity:1;transform:translateX(0);}}
  .histv2-section-label{animation:dashRise var(--m-dur-in) var(--m-ease) backwards;animation-delay:.2s;}
  .histv2-anim-in{animation:dashDayIn var(--m-dur-in) var(--m-ease) backwards;animation-delay:calc(.24s + var(--i,0) * 70ms);}
  /* the summary + exercise rows rise in when a card is EXPANDED (hist-reveal
     set by toggleHistExpandV2 for that one card only — short delays so
     content is never parked invisible, same idiom as the finish screen). */
  .histv2-card.hist-reveal .histv2-wprogress{animation:loadv2Rise var(--m-dur-in) var(--m-ease) backwards;}
  .histv2-card.hist-reveal .histv2-wstat{animation:loadv2Rise var(--m-dur-in) var(--m-ease) backwards;animation-delay:.05s;}
  .histv2-card.hist-reveal .histv2-wrecord{animation:loadv2Rise var(--m-dur-in) var(--m-ease) backwards;animation-delay:.1s;}
  .histv2-card.hist-reveal .histv2-ex-item{animation:histExRow var(--m-dur-in) var(--m-ease) backwards;animation-delay:calc(.1s + var(--i,0) * 40ms);}
  @keyframes histExRow{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
}
.histv2-root .ph{display:block;}
.histv2-root .ph svg{display:block;width:100%;height:100%;}

/* ===================== STATS v2 (Figma nodes 182:12264 "11. Statistic"
   + 183:13393 "11. Statistic - details") — v3-styled replacement for
   #view-stats. One screen, two render modes (see renderStatsV2() JS):
   overview (ring/bar/YTD-wave) vs a selected exercise's detail
   (hero-record/weight-progress-wave/session log) — matches Figma's own
   structure, only the cards below the shared header+tile-row change.
   Header aligned to 40px/30.654px like GYM v2/Plans v2/History v2
   (Figma's own 55.18px/+1.2px reads as the same per-export outlier
   already corrected on History — [[feedback_...]] n/a, just matching
   established sibling screens). Two Figma text typos silently
   corrected when implemented: "EST. IRM" -> "EST. 1RM", "OSTATIO" ->
   "OSTATNIO". One label corrected for a real inconsistency, not just a
   typo: the detail screen's per-exercise chart reused the overview's
   "OBJĘTOŚĆ OD POCZĄTKU ROKU" text verbatim, but what's actually
   plotted (and what the PR badges/hero "100 kg" tie back to) is
   running-best WEIGHT over time, not volume — relabeled "PROGRES
   CIĘŻARU" to match what the chart actually shows. */
.statsv2-root{background:var(--m-panel);}
.statsv2-panel{padding:calc(16px + var(--top-inset)) 10px 40px;position:relative;}
.statsv2-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.statsv2-cards{display:flex;flex-direction:column;gap:8px;}
/* overview chart carousel — a transform track dragged with the finger
   (see statsV2InitCarousel); `touch-action:pan-y` keeps vertical page
   scroll fully native, horizontal is ours. Same throw feel as the
   History calendar. */
.statsv2-caro{overflow:hidden;touch-action:pan-y;margin:0 -7px;}
.statsv2-caro-track{display:flex;align-items:stretch;will-change:transform;}
/* Each slide is a full container-width column with a 7px inner gutter, so
   cards keep 14px of clear space between them (no colour bleed from the
   neighbour); the -7px container margin realigns card edges with the rest
   of the page. Slides stretch to the tallest so the block height is fixed
   across tabs. */
.statsv2-slide{flex:0 0 100%;min-width:0;box-sizing:border-box;display:flex;padding:0 7px;}
.statsv2-slide > *{flex:1;min-width:0;}
.statsv2-caro-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;}
.statsv2-caro-arw{width:26px;height:26px;border:0;background:none;color:var(--m-muted);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.statsv2-caro-arw:active{background:rgba(128,128,128,.14);}
.statsv2-caro-arw .ph{width:16px;height:16px;display:block;}
.statsv2-caro-arw.disabled{opacity:.28;pointer-events:none;}
.statsv2-caro-dots{display:flex;align-items:center;gap:8px;}
.statsv2-caro-dots i{width:7px;height:7px;border-radius:50%;background:var(--m-muted);opacity:.45;transition:transform var(--m-dur-fade) var(--m-ease),opacity var(--m-dur-fade) ease,background var(--m-dur-fade) ease;}
.statsv2-caro-dots i.on{transform:scale(1.2);opacity:1;background:var(--m-orange);}
.statsv2-scard{background:var(--m-card);border-radius:var(--m-r-md);padding:16px;box-sizing:border-box;}
.statsv2-scard-eyebrow{margin:0 0 8px;font-size:var(--m-fs-2xs);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--m-muted);}
.statsv2-scard-num{margin:0;font-size:var(--m-fs-2xl);font-weight:600;color:var(--m-ink);letter-spacing:-.02em;line-height:1;}
.statsv2-scard-num small{font-size:var(--m-fs-base);font-weight:400;color:var(--m-muted);margin-left:4px;}
.statsv2-scard-delta{margin:6px 0 0;font-size:var(--m-fs-2xs);color:var(--m-muted);text-transform:uppercase;letter-spacing:.05em;}
.statsv2-scard-chart{position:relative;height:114px;margin-top:14px;}
.statsv2-scard-chart svg{width:100%;height:100%;overflow:visible;}
.statsv2-scard-labels{display:flex;justify-content:space-between;margin-top:6px;}
.statsv2-scard-labels span{font-size:var(--m-fs-xs);color:var(--m-muted);}
.statsv2-scard-empty{margin:14px 0 6px;font-size:var(--m-fs-sm);color:var(--m-muted);line-height:1.5;}
.statsv2-kcard-arw{width:18px;height:18px;color:var(--m-orange);flex-shrink:0;margin-left:auto;}
.statsv2-kcard-arw.down{transform:scaleY(-1);}

.statsv2-ring-card{background:#000;border-radius:var(--m-r-md);padding:16px;box-sizing:border-box;height:204px;display:flex;flex-direction:column;justify-content:space-between;}
.statsv2-ring-eyebrow{margin:0;}
.statsv2-ring-row{display:flex;align-items:center;justify-content:space-between;}
.statsv2-ring-wrap{position:relative;width:132px;height:132px;flex-shrink:0;}
.statsv2-ring-wrap svg{width:100%;height:100%;overflow:visible;}
.statsv2-ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.statsv2-ring-num strong{font-size:var(--m-fs-2xl);font-weight:400;color:#fff;letter-spacing:1.2px;line-height:1;font-variant-numeric:tabular-nums;}
.statsv2-ring-num small{margin-top:2px;font-size:var(--m-fs-2xs);color:var(--m-muted);letter-spacing:1.1px;text-transform:uppercase;}
.statsv2-ring-legend{display:flex;flex-direction:column;gap:30px;}
.statsv2-ring-legend-row{display:flex;align-items:center;gap:30px;}
.statsv2-ring-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.statsv2-ring-dot.done{background:#ffc07a;}  /* the comet's head colour */
.statsv2-ring-dot.left{background:var(--m-ink);}
.statsv2-ring-legend-label{margin:0;font-size:var(--m-fs-2xs);color:var(--m-muted);letter-spacing:1.1px;text-transform:uppercase;}
.statsv2-ring-legend-value{margin:0;font-size:var(--m-fs-2xl);color:#fff;letter-spacing:1.2px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums;}
@media (prefers-reduced-motion: no-preference){
  /* the ring "draws" tail→head — each segment fades in on a --s stagger */
  .statsv2-ring-seg{animation:statsv2SegIn var(--m-dur-snap) ease both;animation-delay:calc(.18s + var(--s,0) * 10ms);}
  .statsv2-ring-head{animation:statsv2SegIn var(--m-dur-snap) ease both;animation-delay:1.1s;}
  @keyframes statsv2SegIn{from{opacity:0;}to{opacity:1;}}
  /* the comet wave line draws the same way — --p is 0..1 tail→head so the
     whole line lands in ~.8s regardless of how many segments it has */
  .statsv2-comet-seg{animation:statsv2SegIn var(--m-dur-snap) ease both;animation-delay:calc(var(--p,0) * .8s);}
  .statsv2-chart-head{animation:statsv2SegIn var(--m-dur-snap) ease both;animation-delay:.9s;}
}
/* glowing "head" of the comet line, sitting on the latest point */
.statsv2-chart-head{position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:#ffc07a;box-shadow:0 0 9px 3px rgba(255,176,120,.85);}
.statsv2-chart-head.on-orange{background:#fff;box-shadow:0 0 12px 5px rgba(255,255,255,.9);}

.statsv2-bar-card{background:var(--m-card);border-radius:var(--m-r-md);padding:16px;box-sizing:border-box;}
.statsv2-bar-eyebrow{margin:0 0 16px;}
.statsv2-bar-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:112px;}
.statsv2-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;min-width:0;}
.statsv2-bar-col .bar{width:100%;max-width:42px;border-radius:var(--m-r-md);min-height:4px;transform-origin:bottom;}
.statsv2-bar-col span{font-size:var(--m-fs-xs);color:var(--m-ink);letter-spacing:.48px;}
.statsv2-bar-nav{display:flex;align-items:center;justify-content:center;gap:96px;margin-top:16px;}
.statsv2-bar-nav .ph{width:16px;height:16px;color:var(--m-ink);cursor:pointer;}
.statsv2-bar-nav .ph.disabled{opacity:.25;cursor:default;pointer-events:none;}

.statsv2-ytd-card{background:var(--m-orange);border-radius:var(--m-r-md);padding:16px;box-sizing:border-box;}
.statsv2-ytd-eyebrow{margin:0;}
.statsv2-ytd-num-row{display:flex;align-items:center;gap:20px;margin-top:10px;}
.statsv2-ytd-num-row .ph{width:36px;height:36px;color:#fff;flex-shrink:0;}
.statsv2-ytd-num{font-size:var(--m-fs-hero);color:#fff;font-weight:400;letter-spacing:-.88px;font-variant-numeric:tabular-nums;}
.statsv2-ytd-num small{font-size:var(--m-fs-md);color:rgba(255,255,255,.8);margin-left:4px;}
.statsv2-ytd-delta{margin:4px 0 0;font-size:var(--m-fs-2xs);color:#ffd885;letter-spacing:1.1px;text-transform:uppercase;}
.statsv2-ytd-chart{position:relative;height:110px;margin-top:16px;}
.statsv2-ytd-chart svg{width:100%;height:100%;overflow:visible;}
.statsv2-ytd-labels{display:flex;justify-content:space-between;margin-top:8px;}
.statsv2-ytd-labels span{font-size:var(--m-fs-xs);color:#fff;letter-spacing:.48px;}

.statsv2-ex-section{margin-top:8px;}
/* Overview only: this section follows the YTD card there (detail mode
   has it right after the header instead, where the header's own 20px
   margin-bottom already sets the gap — this override only applies when
   .statsv2-ex-section follows .statsv2-cards, i.e. the overview case). */
.statsv2-cards + .statsv2-ex-section{margin-top:24px;}
.statsv2-ex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.statsv2-ex-head p{margin:0;font-size:var(--m-fs-base);color:#2c2727;letter-spacing:.56px;text-transform:uppercase;}
.statsv2-ex-all-btn{background:var(--m-orange);border:none;border-radius:var(--m-r-pill);padding:6px 20px;font-size:var(--m-fs-xs);font-weight:500;color:#fff;letter-spacing:.48px;font-family:inherit;cursor:pointer;}
.statsv2-ex-row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;}
.statsv2-ex-row::-webkit-scrollbar{display:none;}
.statsv2-ex-tile{flex-shrink:0;width:76px;height:84px;border-radius:var(--m-r-sm);background:#fff;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;box-sizing:border-box;cursor:pointer;opacity:.5;transition:opacity var(--m-dur-quick) ease;}
.statsv2-ex-tile.active{opacity:1;border-color:var(--m-orange);}
.statsv2-ex-tile .icn{width:40px;height:40px;color:var(--m-orange);flex-shrink:0;}
.statsv2-ex-tile .icn svg{display:block;width:100%;height:100%;}
.statsv2-ex-tile .icn img{display:block;width:40px;height:40px;object-fit:contain;}
.statsv2-ex-tile span{font-size:var(--m-fs-2xs);font-weight:600;color:#2c2727;letter-spacing:.3px;text-transform:uppercase;text-align:center;line-height:1.15;}

.statsv2-record-card{background:var(--m-orange);border-radius:var(--m-r-md);padding:16px;box-sizing:border-box;}
.statsv2-record-eyebrow{margin:0;}
.statsv2-record-num-row{display:flex;align-items:center;gap:20px;margin-top:8px;}
.statsv2-record-trophy{width:36px;height:32px;color:#fff;flex-shrink:0;}
.statsv2-record-num{flex:1;font-size:var(--m-fs-hero);color:#fff;font-weight:400;letter-spacing:-.88px;font-variant-numeric:tabular-nums;}
.statsv2-record-num small{font-size:var(--m-fs-md);color:rgba(255,255,255,.8);margin-left:4px;}
.statsv2-record-arrow{width:40px;height:40px;color:#fff;flex-shrink:0;}
.statsv2-record-arrow.down{transform:scaleY(-1);}
.statsv2-record-delta{margin:8px 0 16px;font-size:var(--m-fs-2xs);color:#ffd885;letter-spacing:1.1px;text-transform:uppercase;}
.statsv2-record-sep{height:1px;background:rgba(255,255,255,.25);margin-bottom:16px;}
.statsv2-record-stats{display:flex;gap:28px;}
.statsv2-record-stat span{display:block;font-size:var(--m-fs-2xs);color:#fff;letter-spacing:.4px;margin-bottom:4px;}
.statsv2-record-stat strong{font-size:var(--m-fs-md);color:#fff;font-weight:600;}
.statsv2-record-num-x{font-size:var(--m-fs-lg);color:rgba(255,255,255,.82);letter-spacing:0;}
.statsv2-record-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
.statsv2-record-ric{width:18px;height:18px;color:#fff;flex-shrink:0;}
.statsv2-record-rk{flex:1;font-size:var(--m-fs-2xs);color:rgba(255,255,255,.85);letter-spacing:.4px;text-transform:uppercase;}
.statsv2-record-rv{font-size:var(--m-fs-sm);color:#fff;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;}

   the dots used to be SVG <circle> elements inside an svg stretched
   with preserveAspectRatio="none" (needed so the wavy line fills the
   card edge-to-edge). That non-uniform x/y scale turned every circle
   into a slight ellipse. Same fix as the PR tags: plain HTML circles
   positioned by percentage on top of the svg instead of inside its
   distorted coordinate space — a div's border-radius:50% stays a

@media (prefers-reduced-motion: no-preference){
  /* Card / tile entrances play on screen entry (staggered). Only the SVG
     line/ring draw-in is deferred until the element scrolls into view —
     see statsV2SetupDrawReveal(). */
  .statsv2-anim-card{animation:dashTileRise var(--m-dur-tile) var(--m-ease) backwards;animation-delay:calc(.08s + var(--i,0) * 70ms);}
  .statsv2-anim-tile{animation:dashDayIn var(--m-dur-in) var(--m-ease) backwards;animation-delay:calc(.2s + var(--i,0) * 40ms);}
  /* "slupki animowac" — dashBarGrow, same keyframe as the Dashboard trend
     bars. .5s base so the bars start once the bar CARD's own rise
     (--i:1 → .15s delay + .7s) has essentially landed. */
  .statsv2-bar-anim{animation:dashBarGrow var(--m-dur-in) var(--m-ease) backwards;animation-delay:calc(.5s + var(--i,0) * 40ms);}
  /* dots/PR tags fade in near the end of the ~1s line draw so they stay
     in sync with the line reaching them rather than popping early. */
  .statsv2-chart-dot,.statsv2-pr-tag{animation:statsv2DotIn var(--m-dur-snap) ease both;animation-delay:.85s;}
  @keyframes statsv2DotIn{from{opacity:0;}to{opacity:1;}}
}

/* ---- Mekkio motion utilities — use these on NEW screens/components ----
   .m-press       press feedback (scale .97, fast down / soft up)
   .m-rise        small element entrance (8px, --m-dur-in)
   .m-rise-tile   big tile entrance (18px, --m-dur-tile)
   Stagger: set style="--i:N" (N = index) — 60ms per step on top of an
   optional --m-delay. Add the rise classes only on a real "screen/popup
   opened" render (animate=true), never on incidental re-renders. */
.m-press{transition:transform var(--m-dur-press-out) var(--m-ease);}
.m-press:active{transform:scale(.97);transition-duration:var(--m-dur-press-in);}
@media (prefers-reduced-motion: no-preference){
  .m-rise{animation:mRise var(--m-dur-in) var(--m-ease) backwards;animation-delay:calc(var(--m-delay,0ms) + var(--i,0) * 60ms);}
  .m-rise-tile{animation:mRiseTile var(--m-dur-tile) var(--m-ease) backwards;animation-delay:calc(var(--m-delay,0ms) + var(--i,0) * 60ms);}
  @keyframes mRise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes mRiseTile{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
}
/* Asymmetric press (iOS feel): the finger-down scale lands in
   --m-dur-press-in, the release eases back over the base rule's slower
   --m-dur-press-out. Transitions take their timing from the destination
   style, so only the duration needs overriding here. Deliberately a
   list, not a global :active — :active also matches ancestors, which
   would speed up the view slide / sheet snapback mid-touch. */
.plan-pill:active,.topbar-icon-btn:active,.gymfin-cta:active,.ex-tile:active,.save-btn:active,
.hist-card.collapsed:active,.acct-photo-pick:active,.acct-cloud-cta:active,.acct-oauth-btn:active,

.gymv2-tile:active,.gymv2-tile-swap:active,.gymv2-done-row:active,.gymv2-save:active,
.plansv2-btn-outline:active,.plansv2-btn-fill:active,.plansv2-card:active,.plansv2-choice-chip:active,

.pev2-day-chip:active,.equip-chip:active,.pev2-save-fab:active,
.exv2-note-add:active,.exv2-submit:active,.swapv2-submit:not(:disabled):active,
.lg-num:active,.x-ring:active,.gy-circ.gy-x:active,.plansv2-customize-close:active,.newex-v2-close:active,.wnv2-close:active,.exv2-close:active,.swapv2-close:active,.plansv2-close:active,.histv2-card-close:active,.ai-popup-close:active{transition-duration:var(--m-dur-press-in);}

/* ==== GYM 5.0 — workout in progress (Figma 459:6092) + set logging (Figma 461:7553) ==== */
:root{--m-fs-display:108px;--m-fs-display-sm:60px;--m-sheet-top:max(30px, calc(var(--top-inset) + 4px));
  /* Floating sheets, concentric with the screen corner (Maciej, 2026-10-05):
     on Face ID iPhones (home indicator => safe-area-inset-bottom ~34px) the
     sheet floats 10px above the bottom edge and its bottom corners are
     the screen's corner radius x --m-screen-r-k minus that gap (17 Pro:
     62 x 1.13 - 10 = 60px), so the 10px gap stays even around the curve.
     A fixed 45px pinched the 17 Pro's corner to ~7px. With no home indicator
     (iPhone SE, Safari with its bottom toolbar, desktop) env() is 0, so the
     gap and bottom radius collapse to 0 and the sheet sits flush as before. */
  --m-sheet-gap:min(10px, env(safe-area-inset-bottom));
  --m-screen-r:55px; /* overwritten per model by the screen-size lookup in the first <script> */
  /* iOS screen corners are a continuous "squircle", not a circular arc, so a
     CSS circle reads concentric only when it's ~13% larger than the spec
     radius. Tuned by eye on Maciej's 17 Pro (spec 62 -> 60px sheet corner
     looked even; 2026-10-05). */
  --m-screen-r-k:1.13;
  --m-sheet-r-bottom:min(calc(var(--m-screen-r) * var(--m-screen-r-k) - var(--m-sheet-gap)), calc(env(safe-area-inset-bottom) * 2));}

   ticks under them, a small up-pointing triangle under the centre. Ticks up

.lg-ruler::after{right:0;-webkit-mask-image:linear-gradient(270deg,#000,transparent);mask-image:linear-gradient(270deg,#000,transparent);}
.lg-ruler-sp{flex:0 0 calc(50% - var(--lg-tw) / 2);height:1px;}
